# The legacy printer listener: /p/* over PLAIN HTTP, for firmware that cannot load a custom
# certificate. Installed into conf.d by /docker-entrypoint.d/21-legacy-printer-listener.sh, and only
# when LEGACY_PRINTER_PORT is set - so a deployment that never asked for this listener has no server
# block here and the published port simply refuses.
#
# WHY IT EXISTS. custom_cert was broken in firmware for the twenty months after it shipped: the
# certificate file is never read, so the printer reports a TLS error and sends no packets at all,
# whatever we serve on 15443. Every model's newest release carries the fix and updating is the right
# answer - but a printer deliberately held on an older release for its behaviour has no other way in.
# Firmware carries no public CA bundle either, so a publicly-trusted certificate would not help; plain
# is genuinely the only way such a printer can reach us.
#
# WHAT IT COSTS, AND IT IS NOT SMALL. Everything such a printer sends is readable AND MODIFIABLE: its
# token in both directions, every file it is sent, and the PrusaLink password it reports in its own
# INFO. Unlike the transfer listener beside it - whose body is AES-CTR ciphertext and whose exposure
# is therefore integrity alone - nothing here is encrypted at any layer. Treat it exactly as
# homespool-transfer.conf says to treat 15080: publish it to the internet knowingly or not at all.
#
# NO TLS OPTION HERE, EVER. A TLS listener on this port is one the intended printer cannot open, which
# is the entire reason the port exists separately from 15443 rather than being a mode of it.
#
# 15800, deliberately far from 15443: these two carry the same protocol and differ only in whether
# anything protects it, so adjacent numbers would be read as a pair of equals.

server {
    listen 15800;
    server_name _;

    # Everything that is not the printer protocol, refused - the same statement the TLS printer block
    # makes, and it changes no outcome today because Kestrel's own segregation already keeps this
    # listener to /p/*. Both exist so the boundary is legible from the proxy configuration alone.
    location / {
        return 404;
    }

    # No `location = /p/ws` twin of the printer block's, and that is not an oversight: the record-size
    # cap it carries exists to keep TLS records inside the kilobyte of plaintext the firmware's mbedtls
    # holds. There are no TLS records here, so there is no such ceiling to respect.
    location /p/ {
        set $homespool_upstream http://homespool:15800;
        include /etc/nginx/homespool-proxy.conf;

        # OFF both directions, as on the printer block: a transfer pushes 256 KiB chunks, and
        # buffering them here would cost memory for no gain on a path that streams.
        proxy_request_buffering off;

        # A printer connection is idle-but-open for hours between messages, so the 60s default would
        # guillotine a healthy one and cost the printer a reconnect.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
