# The access log format every server block names. Mounted straight into conf.d as
# 00-access-log.conf, because nginx resolves a log format by name at the point an access_log
# directive is parsed, and conf.d is included in sorted order - so this has to sort before every file
# that names it.
#
# WHAT IT DROPS: the query string, from the request line and from the Referer. Emailed links carry
# their credential in the query - a password reset, an invite, an administrator's recovery link - and
# opening one is a GET that the base image's own format logs in full. For most of those the GET only
# renders a form, so the code in the log is still live until the form is submitted, or until it
# expires if it never is; a recovery link needs nothing but its two query values to set a new
# password on the account it names. The Referer needs the same treatment: Referrer-Policy is
# same-origin, so the post from that form carries the full URL of the page it came from.
#
# A "?" is kept where a query was, so a log still says one was there.
#
# WHY EVERY SERVER BLOCK HAS ITS OWN access_log LINE: the base image's nginx.conf sets
# `access_log ... main` in the http block, and a second access_log at the same level adds a log
# rather than replacing one - every request would be written twice, once in full. A server-level
# directive replaces the inherited one outright. tests/access-log.test.sh fails on a server block
# that forgets it.
#
# WHAT IT CANNOT REACH: nginx's error log, whose format is fixed and which names the request line and
# referrer of any request that errors - an upstream refusing connections while the application
# restarts is the likely one. Taking codes out of URLs is the only thing that closes that.
#
# $request rather than $uri, deliberately: $uri is rewritten by an internal redirect, so a request
# answered by the "starting" page would be logged as that page rather than as what was asked for.

map $request $hs_request_logged {
    "~^(?<hs_request_head>[^?]*)\?\S*(?<hs_request_tail>.*)$" "$hs_request_head?$hs_request_tail";
    default $request;
}

map $http_referer $hs_referer_logged {
    # An absent Referer logs as "-", as the base image's format writes it.
    ""  "-";
    "~^(?<hs_referer_head>[^?]*)\?" "$hs_referer_head?";
    default $http_referer;
}

log_format homespool '$remote_addr - $remote_user [$time_local] "$hs_request_logged" '
                     '$status $body_bytes_sent "$hs_referer_logged" '
                     '"$http_user_agent" "$http_x_forwarded_for"';
