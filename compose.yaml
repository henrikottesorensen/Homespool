services:
  printerservice:
    image: printerservice
    build:
      context: .
      dockerfile: Homespool.Host/Dockerfile

    ports:
      # The container listens on 8080 (ASPNETCORE_HTTP_PORTS, baked into the base image - see
      # the Dockerfile's EXPOSE). Change the host side if 8080 is already taken. Remove this
      # block entirely if a reverse proxy publishes the port instead of Compose doing it directly.
      - "${PORT:-8080}:8080"

    environment:
      # Point SQLite at the mounted volume. appsettings.json keeps a relative path so that
      # running outside a container still works.
      ConnectionStrings__HomespoolDb: "Data Source=/app/data/Homespool.Sqlite"

      # What a printer is told to dial for enrolment - not necessarily this container's own
      # listen port or protocol. If a reverse proxy (Caddy, nginx, Traefik) terminates TLS in
      # front of this container, these describe the proxy's public address, not port 8080.
      # PublicHost is required for USB-key provisioning (Printers -> Add printer): the page
      # cannot produce a usable ini snippet - and refuses to - until it is set.
      PrusaConnect__PublicHost: "${PUBLIC_HOST:-}"
      PrusaConnect__PublicPort: "${PUBLIC_PORT:-443}"
      PrusaConnect__PublicTls: "${PUBLIC_TLS:-true}"

      # Outgoing mail. Values come from .env - copy .env.example to .env and edit that, rather
      # than editing this file, so secrets stay out of the repository. Leaving SMTP_HOST empty
      # runs without a mail server: accounts are created already confirmed, and password reset
      # is unavailable.
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      # true for implicit TLS on port 465; false for STARTTLS on 587.
      Smtp__UseImplicitTls: "${SMTP_USE_IMPLICIT_TLS:-false}"
      Smtp__UserName: "${SMTP_USERNAME:-}"
      # Never put the real password here - compose.yaml is committed. Put SMTP_PASSWORD in a
      # local .env file (gitignored) or export it in the shell before running compose.
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-Homespool}"
      # Connects and authenticates once at startup purely to report a broken configuration.
      # Set false if the mail server lives in this stack and starts after this container.
      Smtp__ProbeOnStartup: "${SMTP_PROBE_ON_STARTUP:-true}"

    volumes:
      - printerservice-data:/app/data

    # No healthcheck block is needed: the image declares one against /health/live, so
    # `docker compose ps` shows healthy/unhealthy out of the box, and `depends_on:
    # condition: service_healthy` works against this service.
    #
    # /health/live answers only for faults a restart would fix - today, the telemetry drain loop
    # having stopped. It stays healthy while the database is rejecting writes, because restarting
    # would not fix that and would discard everything still buffered.
    #
    # /health is the fuller report and the one to point monitoring at: same information plus
    # whether telemetry is actually reaching the database, as JSON, with counters. Both are
    # anonymous and exempt from the setup gate, so they answer before the first administrator
    # exists. Alert on /health; never restart on it.

volumes:
  # Keeps the SQLite database across container replacement. Use a local docker volume or a
  # bind-mount to local disk - do NOT put this on NFS/CIFS/a NAS share, where SQLite WAL
  # locking is unreliable and will corrupt the database.
  printerservice-data:
