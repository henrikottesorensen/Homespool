# Runs the suite and builds the container images on a machine that starts from nothing.
#
# The image build is the point. A laptop with a warm layer cache keeps succeeding past the moment a
# clean machine cannot: the Dockerfile's restore layer was broken for weeks, through a project rename
# and several features, while every local `dotnet build` and the whole test suite stayed green,
# because nothing here ever built the image. That is the failure this exists to notice.
#
# Split into jobs that run side by side, because one job doing all of it had grown to about nineteen
# minutes and its run time was down to which runner it drew. The runner has four cores, and
# `dotnet test` over the whole solution sometimes ran two test projects at once, each parallelising
# across all four, so both ran slower than either would alone. Each job below builds what it tests
# and has the machine to itself; the longest of them is the run's length.
name: build and test

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only, for every job. Nothing here pushes, comments or publishes, so the token each run is handed
# needs to read the repository and nothing more - and a step that turns out to be compromised gets that
# much and no further. Without this block the token takes the repository's default, which a settings
# change can widen without anything in this file saying so.
permissions:
  contents: read

jobs:
  # The whole solution's build, and every test project that needs nothing running beside it.
  unit:
    # The release the application image runs on, named rather than taken from ubuntu-latest. The
    # images build inside Docker whatever the runner is, but the test suites run on the runner itself,
    # and .NET formats dates and numbers with the host's ICU: on another release, a CLDR change fails
    # a test the deployment would pass, or passes one it would fail. The shell-script tests run on the
    # runner's coreutils too, so a new release is a change to them as well, and one to make on
    # purpose. Moves when mcr.microsoft.com/dotnet/aspnet:10.0 moves, and so does every runs-on below.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # Every action is pinned to a commit, with the release it was in beside it. A tag is a movable
      # pointer: whoever controls the action's repository can repoint `v7` at different code, and every
      # run after that executes it with this job's token and secrets - the tj-actions/changed-files
      # compromise, March 2025, was exactly that. A commit cannot be moved. Dependabot proposes the
      # updates (.github/dependabot.yml) and keeps the comment in step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # `global.json` sets a floor - 10.0.302, rolling forward to the newest feature band a
          # machine has - because Roslyn ships inside the SDK, so an older band silently enforces
          # fewer analysers than this repo thinks it enforces. Keeping the newest 10.0 here
          # satisfies that floor. Deliberately *not* `global-json-file`: that installs the floor
          # version itself, pinning CI to a band the repo only ever meant as a minimum.
          dotnet-version: '10.0.x'

      # The Host's build runs ESLint over wwwroot/js and needs Node for it. Stated rather than taken from
      # the runner image, whose Node version is the image's to change, and ESLint refuses one too old.
      # 24 to match NODE_MAJOR in Homespool.Host/Dockerfile. This is the one job that lints; the others
      # build the same scripts and set ESLint off.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # Client-side assets are gitignored rather than committed, and the static-asset pipeline wants
      # them present at build time. The Docker build does this for itself inside the image; this is
      # for `dotnet test`, which does not.
      - name: Fetch client-side assets
        run: |
          dotnet tool restore
          cd Homespool.Host && dotnet libman restore

      # Every project, including the ones no test project references, so a compile error anywhere is
      # red here whichever job's tests would have reached it.
      - name: Build
        run: dotnet build Homespool.slnx --nologo

      # Every test project in the solution except the three with jobs of their own, so a new test
      # project runs here without anyone remembering to list it. Each runs even when one before it
      # failed. Host.Test is required in the list: a listing whose format changed would otherwise
      # select nothing and pass.
      - name: Test
        run: |
          projects=$(dotnet sln Homespool.slnx list | grep -E 'Test\.csproj$' | grep -v -E 'Host\.(E2E|Integration|Browser)Test')
          if ! grep -q 'Homespool\.Host\.Test\.csproj' <<< "$projects"; then
            echo "::error::The solution listing did not include Homespool.Host.Test: $projects"
            exit 1
          fi
          status=0
          for project in $projects; do
            dotnet test "$project" --no-build --nologo || status=1
          done
          exit $status

      # Every run writes a .trx per test project; without this they die with the runner, and a red run
      # is diagnosed from its log alone. always(), because a failed run is the one worth reading.
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-unit
          path: TestResults/*.trx
          retention-days: 14

  # One WebApplicationFactory host per test, so this is the longest suite and the one that most needs
  # the four cores to itself.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Read by MSBuild as a property. The unit job lints; here it would only repeat npm ci.
      ESLint: 'false'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Fetch client-side assets
        run: |
          dotnet tool restore
          cd Homespool.Host && dotnet libman restore

      - name: Test
        run: dotnet test Homespool.Host.E2ETest/Homespool.Host.E2ETest.csproj --nologo

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-e2e
          path: TestResults/*.trx
          retention-days: 14

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ESLint: 'false'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Fetch client-side assets
        run: |
          dotnet tool restore
          cd Homespool.Host && dotnet libman restore

      # Brings up Mailpit with STARTTLS and generates the throwaway CA the integration tests verify
      # against. Without it those tests skip themselves, which is right for a laptop and wrong here:
      # this is the only place a genuine STARTTLS negotiation is put in front of SmtpEmailSender,
      # which had once gone a long time without alert mail ever actually being sent.
      - name: Start Mailpit with STARTTLS
        run: ./Homespool.Host.IntegrationTest/start-mailpit-tls.sh

      # Brings up dex as a throwaway OpenID Connect provider. Same argument as Mailpit above: without
      # it ExternalOidcDexTests skip themselves, and they are the only thing anywhere that puts a real
      # provider - real discovery, real PKCE, a real code exchange - in front of the external-login
      # handler. Everything else about that handler is a stub agreeing with its own assumptions.
      - name: Start dex
        run: ./Homespool.Host.IntegrationTest/start-dex.sh

      - name: Test
        run: dotnet test Homespool.Host.IntegrationTest/Homespool.Host.IntegrationTest.csproj --nologo

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-integration
          path: TestResults/*.trx
          retention-days: 14

      # always(), so a failed test still tears down. On an ephemeral runner that costs nothing; the
      # same script runs on a laptop, where it does.
      - name: Stop Mailpit
        if: always()
        run: ./Homespool.Host.IntegrationTest/stop-mailpit-tls.sh

      - name: Stop dex
        if: always()
        run: ./Homespool.Host.IntegrationTest/stop-dex.sh

  # The Playwright release the browser tests are built against, so the browser job can run in the
  # image carrying exactly those browsers. A container image has to be named before a job's first
  # step, so this cannot be a step of that job.
  playwright-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: Homespool.Host.BrowserTest/Homespool.Host.BrowserTest.csproj
          sparse-checkout-cone-mode: false

      - id: read
        run: |
          version=$(grep -oP 'Include="Microsoft\.Playwright" Version="\K[0-9.]+(?=")' Homespool.Host.BrowserTest/Homespool.Host.BrowserTest.csproj)
          if [ -z "$version" ]; then
            echo "::error::No Microsoft.Playwright version found in Homespool.Host.BrowserTest.csproj"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Chromium and WebKit, which the browser tests skip themselves without. They are the only tests that
  # run the camera page's scripts, and WebKit is the nearest thing to Safari a Linux runner has, where
  # the camera view's worst bugs have lived.
  #
  # In Playwright's own image rather than on the runner, because installing the browsers' system
  # libraries on the runner is a hundred-odd packages from Ubuntu's mirror, and on a slow day that
  # alone outlasted the whole job. The image is Ubuntu 24.04 like the runner, so the ICU argument on
  # the unit job holds here too. It floats with the package version, as the application's base image
  # floats with 10.0: Microsoft publishes both.
  browser:
    needs: playwright-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/dotnet:v${{ needs.playwright-version.outputs.version }}-noble
      # Chromium's shared memory, which Docker's default /dev/shm is too small for. Playwright's own
      # guidance for running it in a container.
      options: --ipc=host
    env:
      ESLint: 'false'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image carries an SDK, but not necessarily the newest 10.0 band; the same floor argument as
      # the unit job.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Without these the tests skip themselves rather than fail, the same as a missing browser.
      - name: Fetch client-side assets
        run: |
          dotnet tool restore
          cd Homespool.Host && dotnet libman restore

      # Builds the tests and asks Playwright for their browsers. In this image they are already
      # present and this downloads nothing; were the image and the package ever to disagree, it
      # fetches the right ones instead of letting every test skip. No --with-deps: the image has the
      # system libraries, and fetching them is what this job is here to avoid.
      - name: Check the browsers
        run: ./Homespool.Host.BrowserTest/install-browsers.sh

      - name: Test
        run: dotnet test Homespool.Host.BrowserTest/Homespool.Host.BrowserTest.csproj --nologo

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-browser
          path: TestResults/*.trx
          retention-days: 14

  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap, and compose.yaml carries real decisions now - two published ports, a pinned hostname,
      # a network the application is told about by name.
      - name: Validate the compose file
        run: docker compose config > /dev/null

      # All three images: the application, the proxy that terminates TLS in front of it, and the
      # camera sidecar, compiled from go2rtc's released source.
      #
      # Through ./build.sh rather than `docker compose build` directly, for the same reason this job
      # builds the images at all: the wrapper is what a person is told to run, so it is the thing that
      # has to keep working. Calling compose here would leave the commit-stamping path - the one that
      # only fails by producing an image that quietly reports an unknown commit - tested by nothing.
      - name: Build the container images
        run: ./build.sh

  # The shell scripts' own suites. Each stubs what it talks to, so none needs .NET, a daemon or a
  # network beyond the package install noted on its step.
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-env.sh, on GNU tools. The macOS job below is the half that matters more; this one is
      # here because it costs a second and the Linux route parsing has to work somewhere real.
      - name: Test setup-env.sh
        run: ./tests/setup-env.test.sh

      # The card's boot-partition credential file. Half of what it does is refuse - a credential that
      # arrives once the account already has one, a carriage return a FAT32 editor added invisibly,
      # a private key pasted where a public one goes. None of that shows up on a board where it
      # worked. Linux only: it is a /bin/sh script that runs on the appliance, not on a laptop.
      - name: Test the Pi login provisioning script
        run: ./tests/pi-login.test.sh

      # The card's other boot-partition file, and the same argument: a board that cannot join the
      # network is as headless as one nobody can log into, and this script fails silently in every
      # direction - an SSID hashed into a file name iwd never looks for, an invisible carriage
      # return, a passphrase left in the clear on the one partition any desktop machine can read.
      - name: Test the Pi Wi-Fi provisioning script
        run: ./tests/pi-wifi.test.sh

      # The proxy's name derivation, which decides what the deployment answers to and what gets a
      # certificate. Linux, because it sources a file the nginx image's dash reads - and because
      # bash 3.2, which is what a Mac would run it under, cannot parse that file at all.
      - name: Test the user server-name derivation
        run: ./tests/user-server-names.test.sh

      # The per-name TLS blocks, and which of them carry HSTS: only a name with an issued
      # certificate, never a self-signed one. Linux for the same reason as the step above.
      - name: Test the user TLS server blocks
        run: ./tests/user-tls-servers.test.sh

      # The port named in the redirect and in every emailed link, and the refusal of a value that is
      # not one - which otherwise either stops nginx on an error naming a generated file, or starts
      # it with every link broken. The test renders with envsubst and SKIPS without it, passing this
      # step having checked nothing, and gettext-base is not in the runner's documented packages -
      # so it is installed when absent rather than assumed.
      - name: Test the public Host and port suffix
        run: |
          if ! command -v envsubst >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gettext-base
          fi
          ./tests/public-host.test.sh

      # Every server block names the access log format that leaves query strings out, where emailed
      # links carry their codes. A block that forgets inherits the base image's full-URL log without
      # a word, so this is the only thing that notices.
      - name: Test the proxy access log coverage
        run: ./tests/access-log.test.sh

      # The proxy image carries every file under nginx/ and compose.yaml mounts none of them. A file
      # no COPY names is a listener or a setting absent from the image, and nginx starts without it.
      - name: Test the proxy image carries its configuration
        run: ./tests/proxy-image.test.sh

      # The camera sidecar's image applies every patch under go2rtc/patches. A patch no COPY and no
      # git apply names is a fix absent from the image, and go2rtc builds and starts without it.
      - name: Test the camera sidecar image carries its patches
        run: ./tests/go2rtc-image.test.sh

      # The Go modules the sidecar takes newer than go2rtc's release are resolved to exact versions
      # before the build, or the build fails: part of the list would leave one module at whatever
      # @latest meant that minute while the image's label claimed a full list. curl is a stub.
      - name: Test the camera sidecar's module resolution
        run: ./tests/go-module-versions.test.sh

      # Each image records the git tree of its build context, which the update check on a host
      # compares to tell a new image from the same one stamped with a later commit. A tree printed
      # for uncommitted changes, or one service's tree wired into another's labels, would call two
      # different images the same.
      - name: Test the build context trees and their wiring
        run: ./tests/context-tree.test.sh

      # The base digest every image build records, read the way every buildx answers it. This runner's
      # buildx is recent, so the build above cannot show that an older one - Debian's and Ubuntu's -
      # still gets a digest rather than its human-readable summary. docker is a stub.
      - name: Test the base digest lookup
        run: ./tests/base-digest.test.sh

      # Which names the renewal will act on, and which it refuses before they reach a shell. It
      # talks to the world only through `docker`, and a stub of that is the whole harness, so this
      # needs neither a daemon nor a certificate authority.
      - name: Test the certificate renewal script
        run: ./tests/acme-renew-cert.test.sh

      # Which deployments the installer refuses because an account outside the docker group could
      # change what the root timers run. `id` and `getent` are stubs, so the runner's own docker
      # membership decides nothing.
      - name: Test the certificate installer's ownership check
        run: ./tests/acme-install.test.sh

      # What the publishing script refuses - a modified tree, no registry, a version that is not numbers
      # separated by dots - and that latest moves only after the commit's own tag, never on a failed
      # push, and never back to an older release than the registry's latest holds. build.sh and docker
      # are stubs over a scratch git repository, so no registry is involved.
      - name: Test the image publishing script
        run: ./tests/publish-images.test.sh

      # What a card built from a release accepts as its published images - the commit, for arm64,
      # under the version - that they are pulled into the card's store rather than loaded, so the
      # card's update check can tell them for the published ones, and the .env.example it ships.
      # docker is a stub; jq is real.
      - name: Test the Pi card's release images
        run: ./tests/pi-release-images.test.sh

      # What the scan counts as relevant - a fixable CRITICAL or HIGH, a newer .NET security release,
      # a Homespool fix - what it records without counting, and that it pushes no verdict when a
      # source failed. docker, curl and oras are stubs; jq is real, because the verdict is jq.
      - name: Test the image scanning script
        run: ./tests/scan-images.test.sh

      # What the host's daily check calls newer and what it says a pull would bring - fixes counted
      # along the ancestry rather than the list's date order, a runtime security release, a rebuild -
      # that an older release under the tag is no update, and that an unreachable source leaves the
      # previous report rather than half of a new one. Run under dash, as systemd runs it; docker and
      # curl are stubs.
      - name: Test the host's image check
        run: ./tests/update-check.test.sh

  # setup-env.sh is the one thing here an operator runs BEFORE anything is built, on their own
  # machine, with whatever their operating system ships - so it is the one thing that has to be
  # tested somewhere other than Linux.
  #
  # Two differences make this a real job rather than duplication. Apple's /bin/bash is 3.2, from
  # 2007, and Homebrew's 5.x hides every incompatibility on a developer's Mac. And macOS ships BSD
  # userland: BWK awk rejects a bare ternary inside `print` that gawk accepts silently, which was a
  # live bug in this script. The suite strips PATH to /usr/bin and /bin itself, so a runner's
  # Homebrew cannot creep back in.
  #
  # No Docker on the runner and none needed - every docker call in the suite is stubbed, and the
  # script's own behaviour when the daemon cannot be reached is one of the things under test.
  setup-env-on-macos:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test setup-env.sh on Apple's bash 3.2
        run: /bin/bash tests/setup-env.test.sh
