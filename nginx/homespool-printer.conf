# The printer-facing half of the deployment: /p/* over TLS, in front of Kestrel's plain-HTTP printer
# listener. Installed into conf.d by /docker-entrypoint.d/20-printer-listener.sh, and only when this
# deployment actually has a printer leaf to serve - see that script.
#
# THIS FILE EXISTS BECAUSE .NET CANNOT CAP A TLS RECORD, and that is worth stating plainly since it
# reverses what this project decided first. Kestrel used to terminate here. Buddy firmware builds
# mbedtls with MBEDTLS_SSL_IN_CONTENT_LEN 1024, so a printer holds one kilobyte of TLS plaintext at a
# time; a larger record kills the transfer. SslStream offers no way to bound record size, and the one
# lever from application code - WebSocket frame sizes - only works while nothing downstream coalesces
# them, which is behaviour rather than contract. nginx has ssl_buffer_size, which is a contract.
#
# THE MECHANISM IS NOT WHAT THIS FILE FIRST CLAIMED. It said OpenSSL honours the RFC 6066
# max_fragment_length the printer negotiates, which is true of OpenSSL and irrelevant here: a capture
# of an MK3.5 on 2026-07-31 shows the printer never sends that extension. See ssl_buffer_size below,
# which is the directive actually doing the work, and notes/tls-by-default.md, "Decision 3a's premise
# has shifted" - including the part where the premise shifted twice.

server {
    # The port a printer dials, published by Compose from the host port in its ini. Not 8443: that is
    # the browser's, with a completely different certificate on it.
    listen 15443 ssl;
    server_name _;

    # NO http2. The printer speaks HTTP/1.1 and upgrades to a WebSocket; offering h2 in ALPN to a
    # client that cannot use it is a needless variable in a handshake with one working shape.

    # THE LEAF ALONE, WITH NO CHAIN APPENDED, and this is load-bearing rather than tidy. Firmware's
    # x509_crt_check_ee_locally_trusted requires exactly one certificate to be presented; a proxy that
    # sends leaf + authority fails verification in a way that reads as a protocol bug rather than a
    # certificate one. nginx appends nothing on its own, so keeping it right means keeping this file
    # single-certificate - which PrinterCertificateAuthority guarantees when it writes it, with a test
    # asserting the property.
    #
    # Written by the application into the volume it shares with this container, in PEM because that is
    # what nginx reads and the PKCS#12 beside it is not.
    ssl_certificate     /etc/nginx/printer-certs/printer-leaf.pem;
    ssl_certificate_key /etc/nginx/printer-certs/printer-leaf.key.pem;

    # THE RECORD CAP, AND THE REASON THIS FILE WORKS AT ALL. 512 bytes of plaintext per TLS record -
    # 536 on the wire once AES-GCM adds its 8-byte nonce and 16-byte tag - against nginx's 16k
    # default, which produced 16 408-byte records and killed every file transfer at 0%.
    #
    # It is here rather than left to RFC 6066 negotiation because THE PRINTER DOES NOT NEGOTIATE.
    # Captured from an MK3.5 on firmware 6.5.7+12836, 2026-07-31: its ClientHello offers server_name,
    # signature_algorithms, supported_groups and ec_point_formats, and nothing else. No
    # max_fragment_length, so there is nothing for OpenSSL to honour and honouring it was never the
    # mechanism - that was an inference, and the capture disproved it. What makes this work is nginx
    # capping records unilaterally, which needs no cooperation from the client at all.
    #
    # THE CEILING IS FIRM; THE VALUE UNDER IT IS NOT. MBEDTLS_SSL_IN_CONTENT_LEN is 1024 and it bounds
    # PLAINTEXT rather than the record on the wire, so anything up to 1000 clears it once AES-GCM's 24
    # bytes are counted. Do not exceed that: 1024 would sit exactly on a buffer whose overrun presents
    # as a protocol fault rather than as a size one.
    #
    # WHICH value below the ceiling could not be measured to matter. Six runs on an MK3.5, same
    # 5.3 MB file, 2026-07-31, in the order taken:
    #
    #   plaintext | record | records | duration | throughput
    #         512 |  536 B |  10 362 |   23.50s |  225.8 KB/s
    #        1000 | 1024 B |   5 302 |   25.02s |  212.1 KB/s
    #        1000 | 1024 B |   5 302 |   24.97s |  212.4 KB/s
    #         768 |  792 B |   6 901 |   25.05s |  211.8 KB/s
    #         512 |  536 B |  10 362 |   24.55s |  216.1 KB/s
    #         512 |  536 B |  10 362 |   26.05s |  203.7 KB/s
    #
    #     512: n=3 mean 24.70s sd 1.28   |   768: n=1 25.05s   |   1000: n=2 mean 25.00s sd 0.03
    #
    # THE NOISE IS AN ORDER OF MAGNITUDE LARGER THAN THE EFFECT. 512's three runs span 2.55s; the
    # group means span 0.35s. 512 looked ~6% faster after one run and was still ahead after two, then
    # its third came in slowest of all six. Whatever varies between runs, it is not the record size,
    # and it was NOT identified. Two candidates, neither controlled for:
    #
    #   - The destination file was deleted from PrusaLink between every run, so each transfer wrote
    #     into freshly freed clusters on the USB stick. That keeps reported free space identical
    #     throughout (31 002 214 400 bytes, every run) and is why free space explains nothing here -
    #     but a delete-then-rewrite cycle is exactly the workload that exposes flash wear-levelling
    #     and garbage collection, which are not constant-time and would land squarely on the write
    #     side of a 5.3 MB transfer.
    #   - The host was running packet captures, container builds and test suites throughout, so some
    #     of the spread may be ours rather than the printer's.
    #
    # SO THE VALUE IS CHOSEN FOR HEADROOM, NOT SPEED. 512 leaves half the firmware buffer spare
    # against a limit whose overrun presents as a protocol fault rather than as a size one, and
    # nothing measurable is bought by going higher. Anyone tempted to tune it should first fix the
    # method - a quiet host, a fixed printer state, and enough runs to beat a 1.3s standard deviation -
    # because six runs done casually could not see a difference at all. The effort is better spent on
    # the round-trip count, which notes/transfer-protocol.md, "Why throughput is capped", says is what
    # actually binds here.
    #
    # This supersedes sizing WebSocket frames in the application. That approach could not survive a
    # proxy anyway: nginx reads whatever has arrived from upstream and emits it, so two small frames
    # landing together would have become one oversized record.
    #
    # Same number as proxy_buffer_size below, deliberately: one firmware buffer, one figure. They
    # govern different code paths inside nginx - this one ordinary responses, that one the upgraded
    # tunnel - but they are bounded by the same 1024 bytes on the same board, and two numbers for one
    # constraint is how they drift apart and one of them ends up wrong.
    ssl_buffer_size     512;

    # One protocol and one ciphersuite, because that is precisely what the firmware compiles:
    # ECDHE-ECDSA-AES128-GCM-SHA256 over TLS 1.2, on P-256. Pinned rather than left to nginx's
    # defaults so that a future image with a different default suite list cannot quietly drop the only
    # one that works - which would surface at the printer as Error::Tls and name nothing.
    ssl_protocols       TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_ecdh_curve      prime256v1;
    ssl_prefer_server_ciphers on;

    # Worth having: a printer reconnects on its own retry timer after every drop, and resuming skips
    # a full ECDHE handshake on a board that feels one.
    ssl_session_cache   shared:PRINTERSSL:1m;
    ssl_session_timeout 1h;

    # Camera snapshots arrive as an HTTP body on POST /p/camera. Generous, but not unlimited: nginx
    # defaults to 1m, and the application has its own opinion about size that should be the one that
    # answers.
    client_max_body_size 32m;

    # Everything that is not the printer protocol, refused. The listener behind this proxy serves
    # /p/* and nothing else - Kestrel's own segregation, keyed on the port a connection arrived on -
    # so this changes no outcome today. It is the same statement homespool.conf makes in the other
    # direction, and having both means the boundary is legible from the proxy configuration alone.
    location / {
        return 404;
    }

    # THE FILE TRANSFER PATH, and the only place the record cap actually bites. Exact-match so it
    # wins over the /p/ prefix below.
    #
    # ssl_buffer_size does NOT govern an upgraded connection. Once nginx has switched a request to a
    # WebSocket it stops using its own output-buffer path and tunnels: it writes whatever it just read
    # from upstream straight to SSL_write, so ONE UPSTREAM READ BECOMES ONE TLS RECORD, and the buffer
    # it reads into is proxy_buffer_size. Measured on an MK3.5 transfer, 2026-07-31: records of
    # exactly 4120 bytes on the wire - 4096 of plaintext, which is the proxy_buffer_size default, plus
    # AES-GCM's 24. The printer holds 1024 (MBEDTLS_SSL_IN_CONTENT_LEN) and dropped the connection
    # every ~550 ms, reconnecting into the same failure, which the screen shows as a transfer stuck at
    # 0%.
    #
    # Same figure as ssl_buffer_size, where the ceiling and the measurements behind the choice are
    # written down. It must also stay large enough to hold the 101 response's headers, which nginx
    # reads into this same buffer before the tunnel starts - Kestrel's are around 200 bytes, so there
    # is ample room, but a header set that grew past this would fail as "upstream sent too big header"
    # rather than as anything about record size.
    #
    # Scoped to this location alone deliberately: the other /p/* endpoints are ordinary proxied
    # requests whose response headers must also fit proxy_buffer_size, and there is no reason to make
    # them share a limit that exists for a firmware buffer on a socket they do not use.
    location = /p/ws {
        set $homespool_upstream http://printerservice:15443;
        include /etc/nginx/homespool-proxy.conf;

        proxy_buffer_size       512;
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    location /p/ {
        set $homespool_upstream http://printerservice:15443;
        include /etc/nginx/homespool-proxy.conf;

        # OFF, both directions, and this is the objection decision 3a raised against proxying
        # printers at all. A transfer pushes 256 KiB chunks; buffering them here would reintroduce
        # exactly the failure shape that was spent a day on, one layer further out. Verify on
        # hardware rather than by reading - that was the instruction, and it is a good one.
        proxy_buffering         off;
        proxy_request_buffering off;

        # A printer connection is idle-but-open for hours between messages, so the 60s default would
        # guillotine a perfectly healthy one and the printer would burn a reconnect. Kestrel pings
        # every 120s (WebSocketOptions.KeepAliveInterval), which keeps it well inside this - the hour
        # is headroom for a deployment that turns those off, not a number anything relies on.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
