# Settings for every server this proxy runs - the people-facing names, the default servers that
# refuse an unrecognised Host, and the printer listener - so they sit at the http level, where each of
# those inherits them.

# The version stays out of the Server header and out of nginx's own error pages. The header still
# says "nginx"; removing it altogether needs a third-party module this image does not carry.
server_tokens off;

# Session resumption, with the ticket key rotated. A TLS 1.2 session ticket is the session's master
# secret encrypted under a key nginx holds, and it crosses the wire before encryption starts - so
# anyone who recorded the traffic and later reads that key decrypts every session sealed under it.
# Forward secrecy lasts exactly as long as the key does. (A TLS 1.3 ticket does not have this
# problem: it cannot be turned back into the session it came from, and a resumption does a fresh key
# exchange.)
#
# nginx rotates the key only when a shared session cache is configured, and then once per
# ssl_session_timeout, keeping the previous key to decrypt with - so a key is useful to a thief for
# at most about two timeouts' worth of sessions. Without a cache it never rotates: it lives until the
# proxy restarts, which is what this deployment had.
#
# HERE, AT THE HTTP LEVEL, AND NOWHERE NARROWER. nginx seals tickets with the keys of the listening
# port's default server, even after SNI has chosen a different block. On 8443 that is the block in
# homespool.conf.template that answers everything with 444, so a cache configured only in
# homespool-user-tls.conf leaves the key unrotated - checked against this nginx with a five-second
# timeout: the key name changed on every read with the cache here, and never with it on the named
# block alone.
#
# An hour rather than the day published guidance suggests: resumption saves a handshake, which a
# browser keeping its connection open rarely needs, and the timeout is the whole of the exposure.
# 1m holds about 4000 sessions, far more than a deployment this size opens in an hour.
#
# The printer listener opts out; homespool-printer.conf says why.
ssl_session_cache   shared:HOMESPOOL:1m;
ssl_session_timeout 1h;
