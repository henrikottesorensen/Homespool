<!doctype html>
<!--
  Den danske udgave af starting.html - se den fil for hvorfor siden ikke henter noget som helst.

  De to filer skal holdes i takt: samme markup, samme klasser, samme antal afsnit. Kun teksten og
  lang-attributten adskiller dem. StartingPageTests holder øje med det.
-->
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Homespool starter</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; padding: 1.5rem;
    background: Canvas; color: CanvasText;
  }
  main { max-width: 30rem; text-align: center; }
  .mark { display: block; width: 4.5rem; height: 4.5rem; margin: 0 auto 1.25rem; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.75rem; }
  p { margin: 0 0 0.5rem; line-height: 1.5; opacity: 0.85; }
  .quiet { font-size: 0.875rem; opacity: 0.6; }
  .bar {
    height: 3px; border-radius: 3px; margin: 1.5rem auto 0; max-width: 12rem;
    background: linear-gradient(90deg, transparent, currentColor, transparent);
    background-size: 200% 100%; opacity: 0.5;
    animation: sweep 1.8s linear infinite;
  }
  @keyframes sweep { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 96 96" role="img" aria-label="Homespool">
    <rect width="96" height="96" rx="20" fill="#278ED3"/>
    <path d="M48 6 86 28V74H10V28Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#278ED3" stroke="#278ED3" stroke-width="9" stroke-linejoin="round">
      <ellipse cx="40.5" cy="52.45" rx="23" ry="29"/>
      <ellipse cx="55.5" cy="55.55" rx="23" ry="29"/>
    </g>
    <ellipse cx="40.5" cy="52.45" rx="23" ry="29" fill="none" stroke="#fff" stroke-width="4"/>
    <ellipse cx="55.5" cy="55.55" rx="23" ry="29" fill="#278ED3"/>
    <g fill="none" stroke="#fff" stroke-width="4">
      <ellipse cx="55.5" cy="55.55" rx="23" ry="29"/>
      <ellipse cx="55.5" cy="55.55" rx="6.5" ry="8.2"/>
    </g>
  </svg>
  <h1>Homespool starter</h1>
  <p>Serveren er ved at starte. Denne side genindlæser sig selv med få sekunders mellemrum.</p>
  <p class="quiet">
    Første opstart tager længere &mdash; databasen bliver gjort klar. På en Raspberry&nbsp;Pi kan det
    tage et par minutter.
  </p>
  <div class="bar"></div>
</main>
</body>
</html>
