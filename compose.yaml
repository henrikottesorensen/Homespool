services:
  homespool:
    image: homespool
    build:
      context: .
      dockerfile: Homespool.Host/Dockerfile

    # Pinned, because Docker otherwise derives it from the container id - a new name on every
    # recreation. The printer certificate carries this machine's hostname and is issued once and then
    # frozen, so an unpinned name goes stale the moment the container is replaced: the certificate
    # keeps vouching for a name that no longer resolves, and the provisioning page cannot tell that
    # dead name from a LAN name it simply cannot resolve from in here - so it offers it.
    #
    # Pinning makes it resolve to this container's own address, always, which is precisely what marks
    # it unusable by a printer and keeps it off the list. It also stops the certificate's names
    # churning between reissues, and makes the logs say "homespool" rather than a hex id.
    hostname: homespool

    # NOTHING is published from this container. Both listeners - people on 8080, printers on 15443 -
    # stay inside this network, and the proxy below is the single way in to either. That is what makes
    # X-Real-IP worth trusting on both of them: a client that could reach Kestrel directly could
    # simply write that header itself.
    #
    # The printer port used to be published here, serving TLS from this container. It stopped because
    # .NET cannot serve that TLS correctly: SslStream ignores the max_fragment_length a printer
    # negotiates, so records arrive far larger than the kilobyte of plaintext the firmware holds, and
    # file transfers fail. OpenSSL honours it, nginx is OpenSSL. See notes/tls-by-default.md,
    # "Decision 3a's premise has shifted", and nginx/homespool-printer.conf.
    #
    # To read the printer wire in the clear, use the plaintext override rather than adding a port
    # here: `docker compose -f compose.yaml -f compose.plaintext.yaml up`. It publishes this
    # container's printer port and takes the proxy out of that path, which is what PRINTER_TLS=false
    # means from both ends at once.

    # So that a mail server on the HOST is addressable the same way everywhere. Docker Desktop
    # resolves host.docker.internal on its own; plain Linux Docker does not, and without this line
    # the obvious answer for "my mail server runs on this machine" works on a Mac and fails on the
    # server somebody actually deploys to. localhost cannot be that answer - inside here it is this
    # container, which is what makes the failure read as "connection refused" from a mail server
    # that is plainly running.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # The zone every timestamp a person reads is rendered in. A container with no TZ is UTC, and
      # the rendering is server-side rather than in the browser - print history, uploads, invitations
      # and token pages all call ToLocalTime() - so without this a print that started at 21:00 is
      # shown as 19:00, and an invitation email states an expiry in a zone its reader does not live
      # in. Stored times are unaffected: they are DateTimeOffset in Unix milliseconds, so this
      # changes presentation only and can be corrected later without touching data.
      #
      # UTC by default, which is what every deployment already had.
      TZ: "${TZ:-UTC}"

      # Point SQLite at the mounted volume. appsettings.json keeps a relative path so that
      # running outside a container still works.
      ConnectionStrings__HomespoolDb: "Data Source=/app/data/Homespool.Sqlite"

      # Floor on how often a printer's telemetry is stored, in seconds. 0 keeps every sample, which
      # is the default and the right answer on a machine with a real disk.
      #
      # Exposed because the deployment that most wants to change it is the one least able to reach
      # appsettings.json: SQLite on an SD card, where telemetry is the dominant write and cards die
      # of writes. At roughly one sample per second per printer, a floor of 10 removes about 90% of
      # them. Retention is not an alternative - deleting rows is writing too.
      #
      # Named here rather than left to .env, because compose reads .env only for ${...}
      # substitution: a variable not mapped in this block never reaches the container at all.
      # Setting Storage__MinimumSampleIntervalSeconds directly in .env does nothing, silently.
      Storage__MinimumSampleIntervalSeconds: "${TELEMETRY_MIN_SAMPLE_INTERVAL_SECONDS:-0}"

      # Cameras. The sidecar is addressed by service name on this network; nothing about a camera
      # itself is configured here, because Homespool registers cameras with the sidecar itself.
      Cameras__StreamServerBaseUrl: "${CAMERA_STREAM_SERVER_BASE_URL:-http://go2rtc:1984}"
      Cameras__RefreshFloorSeconds: "${CAMERA_REFRESH_FLOOR_SECONDS:-2}"
      Cameras__MaxAgeSeconds: "${CAMERA_MAX_AGE_SECONDS:-60}"

      # The same pair the go2rtc service is started with, from the same .env values - one source, two
      # readers, so they cannot disagree. Empty password means the sidecar is unauthenticated, which
      # is what a deployment that never published its port already had.
      Cameras__ApiUsername: "${GO2RTC_USERNAME:-}"
      Cameras__ApiPassword: "${GO2RTC_PASSWORD:-}"

      # What a printer is told to use for enrolment. PrinterHost is required for USB-key
      # provisioning (Printers -> Add printer): the page cannot produce a usable ini snippet - and
      # refuses to - until it is set. It should also be one of the names in the certificate, which
      # is minted on first run over every address this machine could see then; if it is set before
      # the first start, it is covered by construction.
      #
      # PrinterPort is the host side of the printer mapping, which now belongs to the proxy - it is
      # the number every provisioning bundle tells a printer to use, so it must match whatever is
      # published there. PrinterTls is one switch for both ends - the tls line written into every ini,
      # and whether a leaf is issued for the proxy to present - so the two cannot disagree: with it
      # off nothing is issued, and the proxy has nothing to serve even if somebody wired it up anyway.
      # Setting it false is a testing tool for reading the wire, never a deployment choice; startup
      # says so, and compose.plaintext.yaml is how it is meant to be done.

      # Which peer may speak for the client - the network below, which is the proxy's and nothing
      # else's. Defaulted rather than left empty now that we ship the proxy: shipping it is what
      # makes its address knowable, which was the whole difficulty with KnownProxies/KnownNetworks.
      # Empty would mean the forwarded-headers middleware is not registered at all, and links in
      # outgoing mail would say http:// while every logged client address was the proxy's.
      #
      # It must agree with PROXY_SUBNET below. Change one and you must change the other, or the
      # headers are silently ignored again.
      XForwarded__KnownNetworks__0: "${PROXY_NETWORK:-172.28.0.0/16}"

      # The same range again, for a different question: which addresses exist only in here. Detection
      # inside a container sees the container, so without this the provisioning page would offer an
      # address no printer on your network can route to, looking exactly as reasonable as the real one.
      #
      # Fed from the same variable deliberately - one network, one value, no way for them to drift. If
      # you change PROXY_SUBNET, this follows, and the page keeps recognising what it should not offer.
      Certificates__ContainerNetworks__0: "${PROXY_NETWORK:-172.28.0.0/16}"

      PrusaConnect__PrinterHost: "${PRINTER_HOST:-}"
      PrusaConnect__PrinterPort: "${PRINTER_PORT:-15443}"
      PrusaConnect__PrinterTls: "${PRINTER_TLS:-true}"

      # Outgoing mail. Values come from .env - copy .env.example to .env and edit that, rather
      # than editing this file, so secrets stay out of the repository. Leaving SMTP_HOST empty
      # runs without a mail server: accounts are created already confirmed, and password reset
      # is unavailable.
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      # true for implicit TLS on port 465; false for STARTTLS on 587.
      Smtp__UseImplicitTls: "${SMTP_USE_IMPLICIT_TLS:-false}"

      # No encryption at all. The application has always supported this and there was no way to
      # reach it from here, so ".env.example: 25 for unencrypted" was advice that could not be
      # taken: with implicit TLS off the sender uses SecureSocketOptions.StartTls, which REQUIRES
      # the upgrade and fails with "does not support the STARTTLS extension" against a server that
      # offers none. That refusal is right on 587 - falling back would put credentials on the wire -
      # but it left a local test inbox unreachable.
      #
      # It puts mail and any credentials in the clear, so it is for a mail server on this same
      # machine and nothing else.
      Smtp__DisableTls: "${SMTP_DISABLE_TLS:-false}"
      Smtp__UserName: "${SMTP_USERNAME:-}"
      # Never put the real password here - compose.yaml is committed. Put SMTP_PASSWORD in a
      # local .env file (gitignored) or export it in the shell before running compose.
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-Homespool}"
      # Connects and authenticates once at startup purely to report a broken configuration.
      # Set false if the mail server lives in this stack and starts after this container.
      Smtp__ProbeOnStartup: "${SMTP_PROBE_ON_STARTUP:-true}"

    volumes:
      - homespool-data:/app/data

      # The leaf the proxy presents to printers, and its key. A separate volume from the one above,
      # and that separation is the point rather than tidiness: the authority's private key lives in
      # /app/data/certificates, and whoever holds it can mint a certificate every provisioned printer
      # will believe, permanently and with no revocation to stop it. The proxy is the container facing
      # the network, so it gets the replaceable half and never the other one.
      - homespool-printer-leaf:/app/data/proxy-certificates

      # Camera *names*, and deliberately not camera access. These directories hold udev's stable
      # symlinks; the devices they point at are passed only to the camera service below, so inside
      # this container the links are listable and their targets do not resolve. That is what lets
      # the UI offer a list of attached cameras while holding no ability to open one.
      #
      # Safe when the host has no cameras at all: unlike `devices:`, a bind mount of a missing path
      # is created empty rather than failing the container. The list is then simply empty, which is
      # what "nothing attached" should look like.
      - /dev/v4l/by-id:/dev/v4l/by-id:ro
      - /dev/v4l/by-path:/dev/v4l/by-path:ro

    networks:
      - homespool

    # The outermost of three shutdown budgets, and the only one Docker enforces: SIGTERM, then
    # SIGKILL after this. The other two are inside the app - TelemetryWriter's final flush (~6.25 s
    # worst case, both attempts timing out) and HostOptions.ShutdownTimeout, derived from it with
    # margin at 12.75 s - and both are sized to finish inside this value.
    #
    # It is set explicitly because the default is 10 s and the app used to need 30: shutdown flush
    # attempts that could each block for ~10 s against a locked database. Every such shutdown was
    # killed part-way through the drain, which lost the buffered telemetry *and* the log line saying
    # how much was lost. Now the app gives up first and reports, which is the whole point of
    # ordering these three.
    #
    # Raise it if a deployment ever needs a longer drain; do not lower it below the app's own
    # timeout, or the SIGKILL lands mid-flush again and the report is lost with it.
    stop_grace_period: 15s

    # No healthcheck block is needed: the image declares one against /health/live, so
    # `docker compose ps` shows healthy/unhealthy out of the box, and `depends_on:
    # condition: service_healthy` works against this service.
    #
    # /health/live answers only for faults a restart would fix - today, the telemetry drain loop
    # having stopped. It stays healthy while the database is rejecting writes, because restarting
    # would not fix that and would discard everything still buffered.
    #
    # /health is the fuller report and the one to point monitoring at: same information plus
    # whether telemetry is actually reaching the database, as JSON, with counters. Both are
    # anonymous and exempt from the setup gate, so they answer before the first administrator
    # exists. Alert on /health; never restart on it.

  # The front door for everything, and the reason "TLS by default" is true of a fresh
  # `docker compose up` rather than of a deployment somebody finished configuring. It terminates TLS
  # for pages and /api on one port and for printers on another, and passes plain HTTP to the app over
  # this network.
  #
  # Printers DO come through here, which reverses what this file used to say two ways up. They have
  # their own port, their own server block and their own certificate - the ECDSA leaf the app mints,
  # which is also the one on the provisioning USB stick - and none of that is shared with the
  # browser's. It is not a preference: .NET cannot serve that TLS correctly, and OpenSSL can. See
  # nginx/homespool-printer.conf.
  #
  # Replacing this with a Traefik, Caddy or nginx of your own is still supported for the people-facing
  # half - the app only needs XForwarded__KnownNetworks to name yours - but the printer half is
  # fussier than a normal reverse proxy: exactly one certificate presented, no chain, one ciphersuite,
  # no response buffering, and OpenSSL rather than Go's crypto/tls. Read homespool-printer.conf before
  # substituting anything for that half.
  # Reads cameras, so Homespool does not have to know how. go2rtc ingests RTSP, ONVIF, HTTP and
  # V4L2 and re-serves every one of them as a plain JPEG over HTTP - which is why there is no camera
  # protocol anywhere in the application, and why the official Prusa Buddy Camera is an ordinary
  # entry in a list rather than a special case.
  #
  # Homespool owns this container's configuration: cameras are added in Homespool, which registers
  # them here over the API. Do not edit go2rtc.yaml by hand - it is written by the sidecar itself
  # when a stream is added, and a camera described in two places is a camera described wrongly in
  # one of them.
  #
  # Its API has no authentication of its own, which is why no port is published: it is reachable
  # from inside this stack and from nowhere else. Do not publish 1984.
  go2rtc:
    image: alexxit/go2rtc:latest

    # The credential is passed on the command line rather than written into go2rtc.yaml, and that is
    # deliberate twice over: Homespool rewrites that file when it registers a camera, so a credential
    # living there would have to survive every merge; and writing it there in the first place would
    # mean authenticating to a server that is not yet configured.
    #
    # Its authentication is one credential for the whole API - it cannot say which streams a caller
    # may see - so this is defence in depth and not the access control. Homespool still proxies every
    # viewing path and applies the camera's own permission check. What it buys is that the sidecar is
    # not open to anything else that can reach it, and a port published by accident is not
    # immediately a camera feed.
    #
    # GO2RTC_PASSWORD comes from .env and is given to both containers, so the two cannot drift.
    #
    # An empty *username* is the off switch, and it has to be: measured 2026-08-09, a username with an
    # empty password turns authentication ON with an empty key and answers 401 to everything,
    # including Homespool. So the pair is set together or not at all - half of it is worse than none.
    command:
      - go2rtc
      - -c
      - /config/go2rtc.yaml
      - -c
      - '{"api":{"username":"${GO2RTC_USERNAME:-}","password":"${GO2RTC_PASSWORD:-}"}}'

    # Named, because Cameras__StreamServerBaseUrl points at it by name rather than by address.
    hostname: go2rtc

    # Cameras plugged into this machine, granted as a class rather than named one at a time
    # (Henrik, 2026-08-08: "B for Pis at least"). Major 81 is video4linux - verified on this
    # project's own board, where it covers both USB webcams and the Pi's built-in codec nodes.
    #
    # Why not `devices:` naming each camera: an entry naming a device that does not exist stops the
    # container from starting, so it could never ship enabled - and Homespool's camera picker would
    # then list a camera it cannot actually open until somebody edits this file and restarts. A list
    # that means "present" rather than "usable" is the thing that arrangement was supposed to avoid.
    #
    # What it costs, stated plainly: this container can open any video device on the machine, and
    # sees the names of everything in /dev. The cgroup rule is what grants access; the bind mount
    # only makes the nodes visible. If you would rather narrow it - a machine with capture hardware
    # that has nothing to do with printing, say - delete both lines below and name each camera:
    #
    #   devices:
    #     - /dev/v4l/by-id/usb-046d_0821_437242E0-video-index0
    #
    # using a by-id path, never /dev/video0: node numbers are handed out in enumeration order, and
    # on this project's test board one camera took video0 from another inside a single session.
    device_cgroup_rules:
      - "c 81:* rmw"

    volumes:
      - homespool-go2rtc-config:/config
      - /dev:/dev

    networks:
      - homespool

    restart: unless-stopped

  proxy:
    image: homespool-proxy
    build:
      context: ./nginx

    ports:
      - "${PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"

      # What a printer connects to, and it must match PrusaConnect__PrinterPort above - that is the
      # number written into every provisioning bundle. 15443 rather than 443 on both sides: containers
      # here run as non-root users and cannot bind 443, and 443 on the host belongs to the browser,
      # since a URL carrying a port number is a daily papercut while a printer's port is typed by no one.
      - "${PRINTER_PORT:-15443}:15443"

    environment:
      # The same zone the application uses, so the two logs can be read side by side. Without it the
      # proxy stamps every access line UTC while the application stamps its own local, and correlating
      # a request across them means doing arithmetic. Not read by the template - envsubst is filtered
      # to HTTPS_PORT_SUFFIX below - only by nginx's own timestamps.
      TZ: "${TZ:-UTC}"

      # Only used to name the self-signed certificate generated on first start. Browsers will warn
      # whatever this says - the certificate is signed by nobody - so it is cosmetic until you
      # replace the certificate with one of your own.
      USER_HOST: "${USER_HOST:-localhost}"

      # The redirect from the HTTP listener has to name the port HTTPS is actually published on -
      # $host carries none, so without this it means 443 and sends browsers to a closed door on any
      # stack that publishes elsewhere. Empty for 443 so the common case keeps a clean URL.
      HTTPS_PORT_SUFFIX: "${HTTPS_PORT_SUFFIX-}"

      # Restricts envsubst to that one variable. WITHOUT THIS the template's own $host, $request_uri
      # and $homespool_upstream are all substituted with nothing, nginx starts on a configuration
      # that parses and redirects everyone to "https://", and the cause looks nothing like the
      # symptom. The filter is the whole safety of this arrangement.
      NGINX_ENVSUBST_FILTER: "HTTPS_PORT_SUFFIX"

    volumes:
      # Read-only, and from the repository rather than baked into the image: this is the file an
      # operator is most likely to want to change (HSTS, a hostname, an extra header), and a mount
      # makes that an edit and a restart instead of a rebuild.
      # A template rather than straight into conf.d: the entrypoint renders it there, substituting
      # the HTTPS port into the redirect. Still the file an operator edits, still a mount so that is
      # an edit and a restart rather than a rebuild - only the path it lands on has moved.
      - ./nginx/homespool.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/homespool-proxy.conf:/etc/nginx/homespool-proxy.conf:ro

      # NOT into conf.d, deliberately. The entrypoint hook copies it there only when this deployment
      # has a printer leaf to serve; dropped straight into conf.d it would be unconditional, and nginx
      # would refuse to start at all on a stack with printer TLS turned off, taking the pages down
      # with it over a certificate the operator deliberately does not have.
      - ./nginx/homespool-printer.conf:/etc/nginx/homespool-printer.conf:ro

      # Holds the user-facing certificate. Named rather than a bind mount so the directory keeps the
      # ownership the image gave it - an unprivileged nginx has to be able to write the self-signed
      # one it generates, and a host directory would arrive owned by whoever created it.
      - homespool-proxy-certs:/etc/nginx/certs

      # And the printer-facing one, written by the app, read-only here. Read-only because this side
      # never has any business changing it: reissue is the app's, through Admin -> Printer
      # certificate, and a proxy that could rewrite the leaf could serve printers a certificate the
      # app knows nothing about.
      - homespool-printer-leaf:/etc/nginx/printer-certs:ro

    networks:
      - homespool

    # service_started, not service_healthy - changed 2026-08-02, and the reasoning it replaces is
    # worth keeping because it was correct about the risk.
    #
    # It used to wait for health, because the app writes the printer leaf on its startup path and
    # 20-printer-listener.sh reads it at start to decide whether to serve the printer listener at
    # all: start them together and the loser is a proxy that came up without printers and says
    # nothing about it until one fails to connect.
    #
    # What that cost was a closed port for the whole of startup. On a Raspberry Pi the first boot
    # migrates a database before it reports healthy, so `http://homespool.local` refused connections
    # for minutes and read as a broken deployment - it was reported as one.
    #
    # The race is now handled where it actually lives rather than by delaying the whole proxy:
    # 20-printer-listener.sh keeps its short wait for the ordinary restart, and otherwise watches for
    # the leaf in the background and reloads nginx when it appears. So the printer listener still
    # never comes up without a certificate; it just no longer holds the pages hostage while it waits.
    #
    # Note what this gives up: "nginx is running" no longer implies "the application was healthy at
    # least once". Anything that reasons that way needs to stop.
    depends_on:
      homespool:
        condition: service_started

    restart: unless-stopped

networks:
  # Pinned rather than left to Docker's allocator, so XForwarded__KnownNetworks can name it. That
  # is the whole reason shipping our own proxy simplifies this: the trusted range stops being
  # something the operator has to discover and becomes something we chose.
  #
  # Change the subnet if it collides with something on your host, and change PROXY_NETWORK in .env
  # to match - the two must agree or forwarded headers are silently ignored.
  homespool:
    ipam:
      config:
        - subnet: "${PROXY_SUBNET:-172.28.0.0/16}"

volumes:
  # Keeps the SQLite database across container replacement. Use a local docker volume or a
  # bind-mount to local disk - do NOT put this on NFS/CIFS/a NAS share, where SQLite WAL
  # locking is unreliable and will corrupt the database.
  homespool-data:

  # The user-facing certificate, self-signed on first start unless you put your own here. Kept
  # across container replacement so that the exception someone clicked through in their browser
  # keeps meaning something - a certificate regenerated on every start teaches people that the
  # warning is noise.
  homespool-proxy-certs:

  # go2rtc's own configuration, written by go2rtc when Homespool registers a camera. Kept across
  # container replacement so cameras survive one - the startup reconciler re-registers anything lost,
  # but a volume means it usually has nothing to do.
  homespool-go2rtc-config:

  # The printer-facing leaf and its key, in PEM: written by the app, read by the proxy. Deliberately
  # NOT part of homespool-data, which holds the certificate authority's private key - the one
  # secret here that cannot be rotated without a USB visit to every printer. This volume holds only
  # what is safe to hand the network-facing container.
  homespool-printer-leaf:
