services:
  printerservice:
    image: printerservice
    build:
      context: .
      dockerfile: Homespool.Host/Dockerfile

    # Pinned, because Docker otherwise derives it from the container id - a new name on every
    # recreation. The printer certificate carries this machine's hostname and is issued once and then
    # frozen, so an unpinned name goes stale the moment the container is replaced: the certificate
    # keeps vouching for a name that no longer resolves, and the provisioning page cannot tell that
    # dead name from a LAN name it simply cannot resolve from in here - so it offers it.
    #
    # Pinning makes it resolve to this container's own address, always, which is precisely what marks
    # it unusable by a printer and keeps it off the list. It also stops the certificate's names
    # churning between reissues, and makes the logs say "homespool" rather than a hex id.
    hostname: homespool

    ports:
      # ONLY the printer listener is published. The user listener stays inside this network, where
      # the proxy below is the single way in - which is also what makes X-Real-IP worth trusting:
      # a client that could reach Kestrel directly could simply write that header itself.
      #
      # Printers, and nothing else: /p/* exists on this listener alone, and no other route does.
      # It is TLS on both sides - the container serves the certificate this deployment mints for
      # itself, which is the one on the provisioning USB stick - so do NOT put a proxy in front of
      # it. The firmware requires exactly one certificate presented, verifies it strictly against
      # that single anchor, and pushes 256 KiB transfer chunks that nginx would buffer.
      #
      # 15443 on both sides: the app runs as a non-root user and cannot bind 443 inside the
      # container, and 443 on the host belongs to the people-facing proxy - a browser URL carrying
      # a port number is a daily papercut, while a printer's port is written into a generated ini
      # and typed by nobody. Publish whatever you like here; PrusaConnect__PrinterPort must match,
      # because that is the number every provisioning bundle tells a printer to dial.
      - "${PRINTER_PORT:-15443}:15443"

    environment:
      # Point SQLite at the mounted volume. appsettings.json keeps a relative path so that
      # running outside a container still works.
      ConnectionStrings__HomespoolDb: "Data Source=/app/data/Homespool.Sqlite"

      # What a printer is told to dial for enrolment. PrinterHost is required for USB-key
      # provisioning (Printers -> Add printer): the page cannot produce a usable ini snippet - and
      # refuses to - until it is set. It should also be one of the names in the certificate, which
      # is minted on first run over every address this machine could see then; if it is set before
      # the first start, it is covered by construction.
      #
      # PrinterPort is the host side of the printer mapping above, since printers reach this
      # container directly. PrinterTls is one switch for both ends - the tls line written into every
      # ini, and whether the listener serves TLS at all - so the two cannot disagree. Setting it
      # false is a testing tool for reading the wire, never a deployment choice; startup says so.

      # Which peer may speak for the client - the network below, which is the proxy's and nothing
      # else's. Defaulted rather than left empty now that we ship the proxy: shipping it is what
      # makes its address knowable, which was the whole difficulty with KnownProxies/KnownNetworks.
      # Empty would mean the forwarded-headers middleware is not registered at all, and links in
      # outgoing mail would say http:// while every logged client address was the proxy's.
      #
      # It must agree with PROXY_SUBNET below. Change one and you must change the other, or the
      # headers are silently ignored again.
      XForwarded__KnownNetworks__0: "${PROXY_NETWORK:-172.28.0.0/16}"

      PrusaConnect__PrinterHost: "${PRINTER_HOST:-}"
      PrusaConnect__PrinterPort: "${PRINTER_PORT:-15443}"
      PrusaConnect__PrinterTls: "${PRINTER_TLS:-true}"

      # Outgoing mail. Values come from .env - copy .env.example to .env and edit that, rather
      # than editing this file, so secrets stay out of the repository. Leaving SMTP_HOST empty
      # runs without a mail server: accounts are created already confirmed, and password reset
      # is unavailable.
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      # true for implicit TLS on port 465; false for STARTTLS on 587.
      Smtp__UseImplicitTls: "${SMTP_USE_IMPLICIT_TLS:-false}"
      Smtp__UserName: "${SMTP_USERNAME:-}"
      # Never put the real password here - compose.yaml is committed. Put SMTP_PASSWORD in a
      # local .env file (gitignored) or export it in the shell before running compose.
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM_ADDRESS:-}"
      Smtp__FromName: "${SMTP_FROM_NAME:-Homespool}"
      # Connects and authenticates once at startup purely to report a broken configuration.
      # Set false if the mail server lives in this stack and starts after this container.
      Smtp__ProbeOnStartup: "${SMTP_PROBE_ON_STARTUP:-true}"

    volumes:
      - printerservice-data:/app/data

    networks:
      - homespool

    # The outermost of three shutdown budgets, and the only one Docker enforces: SIGTERM, then
    # SIGKILL after this. The other two are inside the app - TelemetryWriter's final flush (~6.25 s
    # worst case, both attempts timing out) and HostOptions.ShutdownTimeout, derived from it with
    # margin at 12.75 s - and both are sized to finish inside this value.
    #
    # It is set explicitly because the default is 10 s and the app used to need 30: shutdown flush
    # attempts that could each block for ~10 s against a locked database. Every such shutdown was
    # killed part-way through the drain, which lost the buffered telemetry *and* the log line saying
    # how much was lost. Now the app gives up first and reports, which is the whole point of
    # ordering these three.
    #
    # Raise it if a deployment ever needs a longer drain; do not lower it below the app's own
    # timeout, or the SIGKILL lands mid-flush again and the report is lost with it.
    stop_grace_period: 15s

    # No healthcheck block is needed: the image declares one against /health/live, so
    # `docker compose ps` shows healthy/unhealthy out of the box, and `depends_on:
    # condition: service_healthy` works against this service.
    #
    # /health/live answers only for faults a restart would fix - today, the telemetry drain loop
    # having stopped. It stays healthy while the database is rejecting writes, because restarting
    # would not fix that and would discard everything still buffered.
    #
    # /health is the fuller report and the one to point monitoring at: same information plus
    # whether telemetry is actually reaching the database, as JSON, with counters. Both are
    # anonymous and exempt from the setup gate, so they answer before the first administrator
    # exists. Alert on /health; never restart on it.

  # The people-facing front door, and the reason "TLS by default" is true of a fresh
  # `docker compose up` rather than of a deployment somebody finished configuring. It terminates TLS
  # for pages and /api and passes plain HTTP to the app over this network.
  #
  # Printers never come through here; see the port comments above. Delete this service and publish
  # the app's own 8080 if you already run Traefik, Caddy or an nginx of your own - the app is built
  # to sit behind one, and only needs XForwarded__KnownNetworks to name yours.
  proxy:
    image: homespool-proxy
    build:
      context: ./nginx

    ports:
      - "${PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"

    environment:
      # Only used to name the self-signed certificate generated on first start. Browsers will warn
      # whatever this says - the certificate is signed by nobody - so it is cosmetic until you
      # replace the certificate with one of your own.
      USER_HOST: "${USER_HOST:-localhost}"

    volumes:
      # Read-only, and from the repository rather than baked into the image: this is the file an
      # operator is most likely to want to change (HSTS, a hostname, an extra header), and a mount
      # makes that an edit and a restart instead of a rebuild.
      - ./nginx/homespool.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/homespool-proxy.conf:/etc/nginx/homespool-proxy.conf:ro

      # Holds the certificate. Named rather than a bind mount so the directory keeps the ownership
      # the image gave it - an unprivileged nginx has to be able to write the self-signed one it
      # generates, and a host directory would arrive owned by whoever created it.
      - homespool-proxy-certs:/etc/nginx/certs

    networks:
      - homespool

    depends_on:
      - printerservice

    restart: unless-stopped

networks:
  # Pinned rather than left to Docker's allocator, so XForwarded__KnownNetworks can name it. That
  # is the whole reason shipping our own proxy simplifies this: the trusted range stops being
  # something the operator has to discover and becomes something we chose.
  #
  # Change the subnet if it collides with something on your host, and change PROXY_NETWORK in .env
  # to match - the two must agree or forwarded headers are silently ignored.
  homespool:
    ipam:
      config:
        - subnet: "${PROXY_SUBNET:-172.28.0.0/16}"

volumes:
  # Keeps the SQLite database across container replacement. Use a local docker volume or a
  # bind-mount to local disk - do NOT put this on NFS/CIFS/a NAS share, where SQLite WAL
  # locking is unreliable and will corrupt the database.
  printerservice-data:

  # The user-facing certificate, self-signed on first start unless you put your own here. Kept
  # across container replacement so that the exception someone clicked through in their browser
  # keeps meaning something - a certificate regenerated on every start teaches people that the
  # warning is noise.
  homespool-proxy-certs:
