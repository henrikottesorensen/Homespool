# How a request reaches Kestrel. Shared by every server block so the header set cannot drift between
# them - a /health that arrived with different headers from everything else would be a needle nobody
# would think to look for, and a printer connection whose X-Real-IP worked differently from a user's
# would be worse: it is the address that identifies a misbehaving printer on a LAN.
#
# Headers only, plus the upstream mechanics. Timeouts and buffering are NOT here, because the two
# paths legitimately want different ones: a user upload streams through a proxy that may buffer the
# response, while a printer connection must not be buffered at all and idles for hours between
# messages. Each location sets its own, immediately after including this.
#
# The caller must set $homespool_upstream before including this file.

# Docker's embedded DNS, at a fixed address on every user-defined network. It is needed because the
# upstream below is a *variable*, and that is the point: with a literal name, nginx resolves it once
# at startup and caches the address forever, so replacing the app container - an ordinary
# `docker compose up -d` after a rebuild - leaves the proxy 502ing at an address nothing answers on
# until somebody restarts it too.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_pass $homespool_upstream;
proxy_http_version 1.1;

# What the application is told about the client. XForwardedOptions trusts X-Real-IP and nothing else,
# because X-Forwarded-For is a chain and the classic hole is believing the wrong entry in it.
# $http_host, not $host: they differ by exactly the port, because $host is the Host header with the
# port stripped. With $host the application never learns which port a browser used, so every
# absolute URL it builds - the login challenge, ReturnUrl, a link in outgoing mail - comes out on the
# scheme's default. On a stack publishing HTTPS anywhere but 443 that sends people to a closed door,
# and it is the same defect the redirect in homespool.conf.template had, one layer further in: fixing only the
# redirect got a browser to :8443 and the login challenge bounced it straight back to :443.
#
# No change in what is trusted. Both are the client's Host header - $host is that value with the port
# removed. server_name no longer accepts anything, though: the default server below answers a Host
# this deployment does not know, which is the day-outgoing-mail-is-configured look this comment used
# to defer. The application checks the same list again through AllowedHosts, because a proxy is not
# the only way in.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Removed rather than appended to. The application ignores it already, so this is the second lock on
# the same door: a client-supplied X-Forwarded-For never reaches the process at all, and cannot be
# resurrected by a later change to what the application trusts.
proxy_set_header X-Forwarded-For "";

# Removed for the same reason, and this one was reachable. The application honours X-Forwarded-Host
# (ForwardedHeadersConfigurator) and trusts it because the immediate peer is this proxy - but the
# peer check answers "did this arrive via nginx", not "did nginx write it", and nginx forwards an
# unknown header untouched. So a client-supplied X-Forwarded-Host became Request.Host, and every
# absolute link built from the request - password reset above all - pointed wherever it said.
# Clearing it here is the lock that holds even if the application's trusted set is widened later.
proxy_set_header X-Forwarded-Host "";

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
