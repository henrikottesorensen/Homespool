# The transfer listener: /f/* over PLAIN HTTP, in front of Kestrel's transfer port. Mounted straight
# into conf.d - unlike the printer block there is no certificate to wait for, so nothing decides
# whether this is served; it always is.
#
# What this carries is the encrypted download a printer on the pre-websocket transport fetches over a
# connection it opens itself: AES-CTR ciphertext, keyed by an IV in the URL, with the key having
# travelled to the printer inside the command over the Connect channel. Read from download.cpp at
# v6.2.6 - the printer composes a raw GET on a plain socket, with no TLS anywhere in that path,
# because the board cannot afford a second TLS session (notes/encrypted-download.md, the RAM section).
#
# PLAIN BY DESIGN, THEN. Not "TLS to be added later": a TLS door on this port is a door the printer
# cannot open. The body is ciphertext by construction, so what an observer on this port sees is
# unreadable without the key. What is NOT protected is integrity - CTR is malleable and firmware
# checks nothing about the body but its length, so an on-path attacker can flip gcode bits and
# nothing notices. That is why this port serves exactly one thing, and why notes/internet-exposure.md
# and encrypted-download.md together make it a LAN proposition. Publish it to the internet knowingly
# or not at all.
#
# 15080 beside the printer's 15443: the same range, the suffix saying plain against TLS.

server {
    listen 15080;
    server_name _;

    # Everything that is not a transfer, refused. Kestrel's own segregation already keeps /f/* alone
    # on this port - so this changes no outcome today, and is the same statement the printer block
    # makes for /p/*: the boundary is legible from the proxy configuration alone.
    location / {
        return 404;
    }

    location /f/ {
        set $homespool_upstream http://homespool:15080;
        include /etc/nginx/homespool-proxy.conf;

        # OFF. The body is a streamed file - 100 KB to hundreds of MB of ciphertext - and buffering
        # it here means a full copy to disk before the first byte goes out. The printer's fetch has a
        # timeout, and a large file that spends it being spooled is a transfer that fails at 0% for
        # a reason nothing at either end can name.
        proxy_request_buffering off;

        # A big file on a slow card takes minutes to write. The printer keeps the connection open for
        # the whole body, so the 60s default would cut a healthy transfer mid-file.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
