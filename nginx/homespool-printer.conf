# The printer-facing half of the deployment: /p/* over TLS, in front of Kestrel's plain-HTTP printer
# listener. Installed into conf.d by /docker-entrypoint.d/20-printer-listener.sh, and only when this
# deployment has a printer leaf to serve.
#
# Everything here is shaped by one firmware constraint. Buddy builds mbedtls with
# MBEDTLS_SSL_IN_CONTENT_LEN 1024, so a printer holds one kilobyte of TLS plaintext at a time and a
# larger record kills the transfer. nginx terminates this connection rather than Kestrel because
# nginx can bound record size and .NET cannot. Measurements and the reasoning are in
# notes/tls-by-default.md.

server {
    # The port a printer dials, published by Compose from the host port in its ini. Not 8443: that is
    # the browser's, with a completely different certificate on it.
    listen 15443 ssl;
    server_name _;

    # NO http2. The printer speaks HTTP/1.1 and upgrades to a WebSocket; offering h2 in ALPN to a
    # client that cannot use it is a needless variable in a handshake with one working shape.

    # THE LEAF ALONE, WITH NO CHAIN APPENDED, and this is load-bearing rather than tidy. Firmware's
    # x509_crt_check_ee_locally_trusted requires exactly one certificate to be presented; leaf +
    # authority fails verification in a way that reads as a protocol bug rather than a certificate
    # one. nginx appends nothing on its own, and PrinterCertificateAuthority guarantees the file holds
    # one certificate, with a test asserting it.
    #
    # Written by the application into the volume it shares with this container, in PEM because that is
    # what nginx reads and the PKCS#12 beside it is not.
    ssl_certificate     /etc/nginx/printer-certs/printer-leaf.pem;
    ssl_certificate_key /etc/nginx/printer-certs/printer-leaf.key.pem;

    # THE RECORD CAP. 1000 bytes of plaintext, which is 1024 on the wire once AES-GCM adds its 8-byte
    # nonce and 16-byte tag. nginx defaults to 16k, which emits 16 408-byte records and kills every
    # file transfer at 0%.
    #
    # 1000 is the ceiling, because MBEDTLS_SSL_IN_CONTENT_LEN bounds PLAINTEXT rather than the record
    # on the wire. Do not raise it. Nothing lower is faster either - that was measured rather than
    # assumed, so there is no tuning left to do here.
    #
    # The cap has to be unilateral: the printer does NOT negotiate RFC 6066 max_fragment_length, and
    # a capture confirms its ClientHello omits the extension entirely. Nothing about this depends on
    # the client asking.
    #
    # This directive governs ordinary responses on this port. The WebSocket is a different code path
    # inside nginx and needs proxy_buffer_size instead - see location = /p/ws. Both carry the same
    # figure because both answer to the same firmware buffer, and two numbers for one constraint is
    # how they drift apart and one ends up wrong.
    ssl_buffer_size     1000;

    # One protocol and one ciphersuite, because that is precisely what the firmware compiles:
    # ECDHE-ECDSA-AES128-GCM-SHA256 over TLS 1.2, on P-256. Pinned rather than left to nginx's
    # defaults so that a future image with a different default suite list cannot quietly drop the only
    # one that works - which would surface at the printer as Error::Tls and name nothing.
    ssl_protocols       TLSv1.2;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256;
    ssl_ecdh_curve      prime256v1;
    ssl_prefer_server_ciphers on;

    # Worth having: a printer reconnects on its own retry timer after every drop, and resuming skips
    # a full ECDHE handshake on a board that feels one.
    ssl_session_cache   shared:PRINTERSSL:1m;
    ssl_session_timeout 1h;

    # Camera snapshots arrive as an HTTP body on POST /p/camera. Generous, but not unlimited: nginx
    # defaults to 1m, and the application has its own opinion about size that should be the one that
    # answers.
    client_max_body_size 32m;

    # Everything that is not the printer protocol, refused. The listener behind this proxy serves
    # /p/* and nothing else - Kestrel's own segregation, keyed on the port a connection arrived on -
    # so this changes no outcome today. It is the same statement homespool.conf.template makes in the other
    # direction, and having both means the boundary is legible from the proxy configuration alone.
    location / {
        return 404;
    }

    # THE FILE TRANSFER PATH. Exact-match so it wins over the /p/ prefix below.
    #
    # proxy_buffer_size rather than ssl_buffer_size, because an upgraded connection is tunnelled:
    # nginx writes whatever it just read from upstream straight to SSL_write, so ONE UPSTREAM READ
    # BECOMES ONE TLS RECORD and the buffer it reads into is this one. At its 4k default it emits
    # 4120-byte records, and the printer drops the connection every ~550 ms and reconnects into the
    # same failure - which shows on the printer's screen as a transfer stuck at 0%, with nothing
    # logged as an error at either end.
    #
    # It must also stay large enough to hold the 101 response's headers, which nginx reads into this
    # same buffer before the tunnel starts; Kestrel's are around 200 bytes. Scoped to this location
    # because the other /p/* endpoints are ordinary proxied requests whose response headers share this
    # limit and have no reason to be squeezed by a firmware buffer they never touch.
    location = /p/ws {
        set $homespool_upstream http://printerservice:15443;
        include /etc/nginx/homespool-proxy.conf;

        proxy_buffer_size       1000;
        proxy_buffering         off;
        proxy_request_buffering off;

        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    location /p/ {
        set $homespool_upstream http://printerservice:15443;
        include /etc/nginx/homespool-proxy.conf;

        # OFF both directions: a transfer pushes 256 KiB chunks, and buffering them here would
        # reintroduce the oversized-write failure one layer further out.
        proxy_buffering         off;
        proxy_request_buffering off;

        # A printer connection is idle-but-open for hours between messages, so the 60s default would
        # guillotine a healthy one and cost the printer a reconnect. Kestrel pings every 120s
        # (WebSocketOptions.KeepAliveInterval), which keeps it well inside this - the hour is headroom
        # for a deployment that turns those off, not a number anything relies on.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}
