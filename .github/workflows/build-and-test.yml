# Runs the suite and builds the container images on a machine that starts from nothing.
#
# The image build is the point. A laptop with a warm layer cache keeps succeeding past the moment a
# clean machine cannot: the Dockerfile's restore layer was broken for weeks, through a project rename
# and several features, while every local `dotnet build` and the whole test suite stayed green,
# because nothing here ever built the image. That is the failure this exists to notice.
name: build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          # TEMPORARY, for the Razor-cascade investigation - `notes/housekeeping.md`, "One C# error
          # can present as a storm of Razor errors". `global.json` no longer states a floor: it pins
          # 10.0.302 exactly, with rollForward `disable`, so the whole project sits on one band while
          # the cascade is being counted. `10.0.x` here would install a 10.0.4xx, which that pin then
          # refuses - CI would fail to select an SDK before building anything. These two move
          # together; changing one without the other breaks the build.
          #
          # What the pin costs, and why it is acceptable for now: Roslyn ships inside the SDK, so an
          # older band enforces fewer analysers than this repo thinks it enforces. That risk was
          # measured on 2026-08-27 rather than assumed - the solution builds 0 errors, 0 warnings on
          # 10.0.302, so the older band hides nothing here. Re-check that if the pin outlives the
          # investigation, and restore `10.0.x` plus a rolling floor when it ends.
          dotnet-version: '10.0.302'

      # Client-side assets are gitignored rather than committed, and the static-asset pipeline wants
      # them present at build time. The Docker build does this for itself inside the image; this is
      # for `dotnet test`, which does not.
      - name: Fetch client-side assets
        run: |
          dotnet tool restore
          cd Homespool.Host && dotnet libman restore

      # Brings up Mailpit with STARTTLS and generates the throwaway CA the integration tests verify
      # against. Without it those tests skip themselves, which is right for a laptop and wrong here:
      # this is the only place a genuine STARTTLS negotiation is put in front of SmtpEmailSender, and
      # notes/housekeeping.md records that alert mail had never actually been sent by anything.
      - name: Start Mailpit with STARTTLS
        run: ./Homespool.Host.IntegrationTest/start-mailpit-tls.sh

      # Brings up dex as a throwaway OpenID Connect provider. Same argument as Mailpit above: without
      # it ExternalOidcDexTests skip themselves, and they are the only thing anywhere that puts a real
      # provider - real discovery, real PKCE, a real code exchange - in front of the external-login
      # handler. Everything else about that handler is a stub agreeing with its own assumptions.
      - name: Start dex
        run: ./Homespool.Host.IntegrationTest/start-dex.sh

      - name: Test
        run: dotnet test Homespool.slnx --nologo

      # Cheap, and compose.yaml carries real decisions now - two published ports, a pinned hostname,
      # a network the application is told about by name.
      - name: Validate the compose file
        run: docker compose config > /dev/null

      # setup-env.sh, on GNU tools. The macOS job below is the half that matters more; this one is
      # here because it costs a second and the Linux route parsing has to work somewhere real.
      - name: Test setup-env.sh
        run: ./tests/setup-env.test.sh

      # Both images: the application and the proxy that terminates TLS in front of it.
      #
      # Through ./build.sh rather than `docker compose build` directly, for the same reason this job
      # builds the images at all: the wrapper is what a person is told to run, so it is the thing that
      # has to keep working. Calling compose here would leave the commit-stamping path - the one that
      # only fails by producing an image that quietly reports an unknown commit - tested by nothing.
      - name: Build the container images
        run: ./build.sh

      # always(), so a failed test still tears down. On an ephemeral runner that costs nothing; the
      # same script runs on a laptop, where it does.
      - name: Stop Mailpit
        if: always()
        run: ./Homespool.Host.IntegrationTest/stop-mailpit-tls.sh

      - name: Stop dex
        if: always()
        run: ./Homespool.Host.IntegrationTest/stop-dex.sh

  # setup-env.sh is the one thing here an operator runs BEFORE anything is built, on their own
  # machine, with whatever their operating system ships - so it is the one thing that has to be
  # tested somewhere other than Linux.
  #
  # Two differences make this a real job rather than duplication. Apple's /bin/bash is 3.2, from
  # 2007, and Homebrew's 5.x hides every incompatibility on a developer's Mac. And macOS ships BSD
  # userland: BWK awk rejects a bare ternary inside `print` that gawk accepts silently, which was a
  # live bug in this script. The suite strips PATH to /usr/bin and /bin itself, so a runner's
  # Homebrew cannot creep back in.
  #
  # No Docker on the runner and none needed - every docker call in the suite is stubbed, and the
  # script's own behaviour when the daemon cannot be reached is one of the things under test.
  setup-env-on-macos:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Test setup-env.sh on Apple's bash 3.2
        run: /bin/bash tests/setup-env.test.sh
