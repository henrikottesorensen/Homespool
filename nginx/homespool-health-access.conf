# Who may ask this deployment how it is.
#
# /health is anonymous by design and stays that way: a monitoring system holds no credentials, which
# is the whole reason Program.cs maps it outside authentication. What this adds is not a credential
# but a horizon - the body is only worth reading to somebody who is already close enough for it not
# to matter.
#
# WHAT IT DISCLOSES, which is why the horizon exists at all. The report carries every address and
# hostname the printer certificate covers, whether PRINTER_HOST resolves publicly, and the WebRTC
# candidate a browser is told to use - an address and port. No credentials, no tokens, no printer
# serials, no user data. On a LAN that is worth approximately nothing: anyone who can reach this port
# can already run a ping sweep. From the internet it is free reconnaissance of an internal network,
# and that asymmetry is exactly what an address filter answers.
#
# PRIVATE RANGES ONLY, and hardcoded rather than templated, because these ranges do not change. A
# deployment that genuinely monitors from a public address edits this file - it is bind-mounted from
# the checkout, so that needs no rebuild.
#
# It does not touch the container's own HEALTHCHECK: that curls localhost:8080 inside the application
# container and never comes through this proxy at all.
#
# ONE LIMIT WORTH KNOWING. This matches on the address nginx sees. Put another proxy in front of this
# one and every request arrives from that proxy, so the filter sees one address and lets everything
# through. Closing that means real_ip_module and a decision about which upstream to believe - the
# same X-Forwarded-For entry-selection problem the application deliberately avoids, so it is not
# taken on here.
#
# Docker's own port relay is such a proxy. A published port with no address also listens on IPv6,
# and with no IPv6 on the compose network a v6 connection arrives from the bridge gateway,
# 172.28.0.1 - which the private ranges below admit. That is why compose.yaml publishes every port on
# 0.0.0.0 alone; the ranges here assume it.
allow 127.0.0.0/8;
allow ::1/128;

# RFC 1918, and CGNAT for a deployment behind a carrier-grade NAT.
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 100.64.0.0/10;

# IPv6 unique-local, and link-local for both families.
allow fc00::/7;
allow fe80::/10;
allow 169.254.0.0/16;

deny all;
