# How a request reaches Kestrel. Shared by every server block so the header set cannot drift between
# them - a /health that arrived with different headers from everything else would be a needle nobody
# would think to look for, and a printer connection whose X-Real-IP worked differently from a user's
# would be worse: it is the address that identifies a misbehaving printer on a LAN.
#
# Headers, the upstream mechanics, and response buffering. TIMEOUTS are still NOT here, because the
# paths legitimately want different ones: an upload over household wifi needs minutes, a printer
# connection idles for hours between messages, and a live camera view runs as long as somebody
# watches. Each location that needs one sets it immediately after including this - and a location
# that says nothing is taking nginx's 60s default deliberately, which is the right answer for a
# health probe and the wrong one for everything listed above.
#
# The caller must set $homespool_upstream before including this file.

# Buffering OFF for everything, which reverses nginx's default and is the whole of the reasoning
# below - it used to be set per location, and every location that had an opinion said "off".
#
# WHAT BUFFERING IS FOR: reading a response out of the upstream as fast as it will come, so the
# upstream connection is freed while nginx feeds a slow client at the client's pace. That is worth
# real money when a held connection is expensive - a worker process, a thread. **Kestrel is async**,
# so a slow client costs a socket and some buffers and no thread at all, and the protection buys
# approximately nothing here.
#
# WHAT IT COSTS, both of which this deployment actually meets:
#
#   A response that never ends is drained for ever. With buffering on, nginx keeps reading after the
#   client has gone - correct for a response that finishes, ruinous for a live camera stream: the
#   application never learns the viewer left, so it relays on, and the stream server holds the USB
#   camera open at 100% of a core. Measured 2026-08-19, and the symptom was every still afterwards
#   answering 204 with nothing in any log, because the request had not finished so nothing had logged
#   it. That was first patched on the camera location alone; off by default is what makes the class
#   of bug impossible rather than that one instance of it.
#
#   A large response to a slow client is spooled to disk. nginx only writes a temp file when the
#   client cannot keep up - never on a LAN - but "slow client" is exactly the internet-facing case
#   the threat model assumes, and a gcode download may be 512 MB. Writing that to an appliance's card
#   before the client has any of it is the same wear this project already rations telemetry to avoid.
#
# What is given up: nothing measured. If a future path genuinely wants buffering - a slow upstream
# feeding many slow clients - it sets `proxy_buffering on;` in its own location and says why.
proxy_buffering off;

# Docker's embedded DNS, at a fixed address on every user-defined network. It is needed because the
# upstream below is a *variable*, and that is the point: with a literal name, nginx resolves it once
# at startup and caches the address forever, so replacing the app container - an ordinary
# `docker compose up -d` after a rebuild - leaves the proxy 502ing at an address nothing answers on
# until somebody restarts it too.
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_pass $homespool_upstream;
proxy_http_version 1.1;

# What the application is told about the client. XForwardedOptions trusts X-Real-IP and nothing else,
# because X-Forwarded-For is a chain and the classic hole is believing the wrong entry in it.
#
# $hs_public_host, not the Host header as it arrived: the name the client asked for, carrying the
# port this deployment publishes rather than the port the client typed. The application builds every
# absolute URL from this header - the login challenge, ReturnUrl, a link in outgoing mail - so a
# port has to be in it, or a stack publishing HTTPS anywhere but 443 sends people to a closed door;
# and the port cannot be the client's, because neither server_name matching nor AllowedHosts looks
# at one, so a known name with any port on it passes both checks and the link in a password-reset
# mail is whatever the sender of the request chose.
#
# The name is still the client's, and is still checked twice: the default server in the rendered
# template refuses a Host this deployment does not know, and the application checks the same list
# again through AllowedHosts, because a proxy is not the only way in. 00-public-host.conf holds the
# value, and says which listener gets which - the printer-side listeners are unchanged.
proxy_set_header Host              $hs_public_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Removed rather than appended to. The application ignores it already, so this is the second lock on
# the same door: a client-supplied X-Forwarded-For never reaches the process at all, and cannot be
# resurrected by a later change to what the application trusts.
proxy_set_header X-Forwarded-For "";

# Removed for the same reason. The application ignores X-Forwarded-Host (ForwardedHeadersConfigurator)
# and builds every absolute link - password reset above all - from the Host header passed through
# above, which is the one value host filtering checks. The peer check alone would not have been
# enough: it answers "did this arrive via nginx", not "did nginx write it", and nginx forwards an
# unknown header untouched. Clearing it here is the second lock, and holds even if the application
# ever honours the header again.
proxy_set_header X-Forwarded-Host "";

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
