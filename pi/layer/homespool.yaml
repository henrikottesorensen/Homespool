# METABEGIN
# X-Env-Layer-Name: homespool
# X-Env-Layer-Category: app
# X-Env-Layer-Desc: The Homespool compose stack, with its container images baked in and loaded on
#  first boot.
#  .
#  Note on the requires below: docker-debian-trixie is named directly rather than its "docker"
#  provides token, because the bookworm layer provides that same token and which one you get should
#  not depend on resolution order when the suite here is trixie. trixie-minbase brings apt, systemd
#  networking and sshd - without it there is no way onto the box to see what went wrong.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: trixie-minbase,docker-debian-trixie,device-user-admin
#
# X-Env-VarPrefix: homespool
#
# X-Env-Var-payload:
# X-Env-Var-payload-Desc: Directory holding the saved container images and the compose stack that
#  runs them. Built by pi/build.sh - it is generated rather than committed, because it is most of a
#  gigabyte of container layers.
# X-Env-Var-payload-Required: y
# X-Env-Var-payload-Valid: dir
# X-Env-Var-payload-Set: y
#
# X-Env-Var-assetdir:
# X-Env-Var-assetdir-Desc: Directory holding the first-boot script and its systemd unit (pi/files).
# X-Env-Var-assetdir-Required: y
# X-Env-Var-assetdir-Valid: dir
# X-Env-Var-assetdir-Set: y
#
# X-Env-Var-sshkey:
# X-Env-Var-sshkey-Desc: Path to a public key authorised for the device user. Optional, and normally
#  unset - a card built for other people cannot carry anybody's key, so a distributed image ships
#  with the account locked and homespool-login.txt on the boot partition is how it gets a credential.
#  This is for a card you are building for yourself.
#  .
#  Set is n rather than y deliberately. With y the empty default is *set*, as an empty string, which
#  then fails this variable's own "string cannot be empty" validation - so declaring an optional
#  variable the obvious way makes every build that does not use it fail. Unset is what optional
#  means here.
# X-Env-Var-sshkey-Required: n
# X-Env-Var-sshkey-Valid: string
# X-Env-Var-sshkey-Set: n
# METAEND
---
mmdebstrap:
  packages:
    # The Pi's address is what a printer has to use and what the certificate has to cover, and on a
    # home LAN it is handed out by DHCP. mDNS means there is a name that survives the lease changing,
    # which is the difference between "it moved" and "it is gone".
    - avahi-daemon
    - libnss-mdns

    - ca-certificates

    # iproute2 is NOT in trixie-minbase - there is no `ip` binary at all, because systemd-networkd
    # does its own netlink work and nothing else in the base needs one. The first-boot script used
    # `ip route get` to find this machine's address, got "command not found" into a suppressed
    # stderr, and retried forever on every card built. setup-env.sh does the same lookup now and
    # falls back to `hostname -I`, but it still wants this - and it is the first thing anyone reaches
    # for when a board is not on the network, which is exactly when it was missing.
    - iproute2

    # systemd's pager. Without it journalctl dumps raw to the terminal and every invocation wants
    # --no-pager to be readable, which is a small tax paid on every single debugging session.
    - less

    # curl is baked into the application container for its healthcheck, which makes its absence out
    # here especially confusing: the stack is demonstrably probing itself over HTTP while `curl
    # localhost` from the operator's own shell reports command not found.
    - curl

    # Debian security updates, applied by the board itself.
    #
    # Without it this card runs whatever openssl, openssh and glibc shipped the day it was written,
    # for as long as it is plugged in - which for an appliance in a cupboard is years. Nobody logs
    # into one of these to run apt, and expecting them to is the same mistake as expecting them to
    # change a default password.
    #
    # It costs 3.6 MB, measured on a built card rather than estimated: eight packages, and the
    # rootfs goes 975 MB to 978 MB. An earlier version of this comment guessed "tens of megabytes"
    # by counting the dependency list, which over-counted six-fold and named two packages that were
    # already installed - python3 arrives with rpi-eeprom, and ucf with openssh-server. The largest
    # single item is xz-utils at 1.5 MB.
    #
    # The alternative is a timer running apt-get ourselves, which is the version of this that goes
    # wrong: dpkg conffile prompts, held packages, a partial upgrade interrupted by a power cut.
    # That handling is the whole substance of the package and none of it is worth reimplementing.
    #
    # What it does NOT update is the Homespool stack: those images are baked into the card's Docker
    # store and this only ever touches Debian packages. See pi/README.md.
    - unattended-upgrades

    # Grows the root partition to fill whatever card the image was flashed onto. A distributed image
    # cannot know that size, which is the one case rpi-image-gen deliberately does not cover: its
    # answer is to build the image at the size of a known target and rely on sparseness, because its
    # envisaged flow is rpi-sb-provisioner or fastboot writing to a board you have in your hand.
    #
    # This package rather than a growpart unit of our own, and the reason is *where* it resizes:
    # its initramfs script grows the partition before root is mounted, where ours would be
    # operating on a live mounted filesystem. For code that rewrites a partition table on a
    # stranger's SD card, the version Raspberry Pi ships to millions - running at the safe moment -
    # wins on both counts.
    #
    # It brings raspi-config, parted, fdisk, whiptail and uuid with it, and its Imager helpers come
    # along doing nothing (see the README on why Imager customisation cannot work here). That is the
    # price. Recommends are off in this tree, which matters: userconf-pi would otherwise arrive and
    # want to own the user account this layer creates.
    - raspberrypi-sys-mods

    # Not optional, and the reason is a single missing binary.
    #
    # initramfs-tools ships BUSYBOX=auto, which silently falls back to klibc-utils when busybox is
    # absent - and klibc provides no grep. Every Raspberry Pi initramfs script begins by grepping
    # /proc/cmdline, so all four die on their first statement:
    #
    #   /scripts/local-premount/resize_early: 11: grep: not found
    #   /scripts/local-bottom/set_partuuid:   14: grep: not found
    #   /scripts/local-bottom/imager_fixup:   13: grep: not found
    #   /scripts/init-top/rpi_wd:             14: grep: not found
    #
    # That is why the root partition never grew: resize_early was installed, listed in ORDER, and
    # invoked correctly - it just could not run its first line. The failure is invisible without a
    # serial console, because `debug` on the kernel command line does not print the trace, it
    # redirects it into /run/initramfs/initramfs.debug.
    - busybox

    # For working out why the radio is not on the network. The base image ships iwctl and nothing
    # else, which is enough to connect and not enough to find out why connecting failed: iw shows
    # what the kernel thinks the regulatory domain and channel list are, and rfkill shows a soft
    # block, which is invisible from iwctl and looks identical to "no networks found".
    - iw
    - rfkill

    # Compressed swap in RAM, and the alternative it rules out is the point: a swapfile on the card
    # would be the worst possible place for it. Measured on the cards this project actually uses -
    # ~500 random write IOPS with 51-107 ms stalls at p99.9, and over a second on one of them
    # - and swap is the most latency-sensitive random I/O a system
    # does. That buys "does not OOM" at the price of "unusable", while grinding write cycles into an
    # SD card. zram never touches the card.
    #
    # Proven rather than proposed: on a 2 GB Pi 5 it holds 172.5 MB of data in 87.9 MB of RAM, a 3.8x
    # compression ratio on .NET heaps and container metadata, and it is what makes `dotnet build` fit
    # on that board without the OOM killer intervening.
    #
    # Unconditional rather than gated on a memory size, which was considered and is worse on every
    # axis. An idle zram device allocates almost nothing - it is not a reservation, it fills only as
    # pages are compressed into it - so there is no cost on a large board to gate against. And the
    # gate would be awkward to express: config.txt filters are by *model*, and [pi5] covers 1 GB
    # through 16 GB alike, so it would need runtime detection - more machinery, and a new failure
    # mode, than the thing it gates. `zram-size = ram` self-scales instead.
    #
    # It matters most where the failure is ugliest, which is the small board rather than the big one:
    # a build that OOMs annoys somebody at a keyboard, while an appliance that OOMs goes quiet in a
    # cupboard - and with no memory cgroup controller here the kernel picks its victim by badness
    # score, so it may take sshd and leave a board nobody can reach to find out why.
    - systemd-zram-generator

  customize-hooks:
    # The stack itself: compose file, the nginx configuration it bind-mounts, and the saved images.
    # /opt rather than /home, because this is not the device user's to lose.
    - mkdir -p $1/opt/homespool
    - cp -a ${IGconf_homespool_payload}/. $1/opt/homespool/

    # No script to install alongside it any more: the unit calls /opt/homespool/setup-env.sh, which
    # arrives with the payload above, and then docker compose. homespool-firstboot.sh carried its own
    # copy of the address detection and is gone.
    - install -m 0644 ${IGconf_homespool_assetdir}/homespool-firstboot.service $1/etc/systemd/system/homespool-firstboot.service

    - install -m 0755 ${IGconf_homespool_assetdir}/homespool-wifi.sh $1/usr/local/sbin/homespool-wifi
    - install -m 0644 ${IGconf_homespool_assetdir}/homespool-wifi.service $1/etc/systemd/system/homespool-wifi.service
    # Onto the boot partition, which is the one a desktop machine can see. Everything under
    # /boot/firmware here is what genimage copies into the FAT32 partition.
    - install -m 0644 ${IGconf_homespool_assetdir}/homespool-wifi.txt $1/boot/firmware/homespool-wifi.txt

    # The other credentials a headless board needs before anyone has logged into it, by the same
    # route and for the same reason. This image ships the account locked with no authorised key, so
    # this file is how it gets either - and it supplies the first of each only. A password and a key
    # answer different failures (a key is no use at the console), so it takes both. The script says
    # why at length.
    - install -m 0755 ${IGconf_homespool_assetdir}/homespool-login.sh $1/usr/local/sbin/homespool-login
    - install -m 0644 ${IGconf_homespool_assetdir}/homespool-login.service $1/etc/systemd/system/homespool-login.service
    - install -m 0644 ${IGconf_homespool_assetdir}/homespool-login.txt $1/boot/firmware/homespool-login.txt

    - |-
      #
      # Two things the account's name has to reach, and this layer is the only place that knows it:
      # build.sh takes --user, so "pi" is a default rather than a fact.
      #
      # /etc/default/homespool-login is what the script reads. Its alternatives were hardcoding
      # the name or guessing at uid 1000 - both assertions about somebody else's configuration, made
      # in the one script whose mistakes lock people out of the board.
      #
      # The @USER@ in the boot-partition file is the same name for a person to read: that file tells
      # somebody which account they are setting a password for, and a card built with --user would
      # otherwise name the wrong one. A placeholder rather than prose hedging both ways; the grep
      # makes one that survived a build failure here rather than something a stranger reads on the
      # card and cannot act on.
      set -eu
      printf 'HOMESPOOL_USER=%s\n' "$IGconf_device_user1" > $1/etc/default/homespool-login
      chmod 0644 $1/etc/default/homespool-login

      # Escaped before it goes into a replacement, because sed reads three characters there that no
      # sane user name contains and --user will nonetheless accept: '&' means the whole match, '/'
      # ends the expression, and '\' escapes whatever follows. Unescaped, "a&b" substitutes to
      # "a@USER@b" and "a/b" is a syntax error. The grep below already turned both into a failed
      # build rather than a bad card, which is the property worth keeping; this makes them work.
      user=$(printf '%s' "$IGconf_device_user1" | sed 's/[&/\]/\\&/g')
      sed -i "s/@USER@/$user/g" $1/boot/firmware/homespool-login.txt
      grep -q '@USER@' $1/boot/firmware/homespool-login.txt && exit 1 || true

    # No fstab hook here, and the reason is worth keeping. /etc/fstab inside the chroot reads
    # "UNCONFIGURED FSTAB FOR BASE SYSTEM", which looks exactly like nothing mounts /boot/firmware -
    # and a hook appending an entry for it was written on that basis. It was dead code: the real
    # fstab is generated during *image* generation, complete with both the root and /boot/firmware
    # entries on by-slot names, and it overwrites anything a customize-hook put there.
    #
    # Same shape as the hostname mistake below: the chroot is not the finished filesystem, so
    # "nothing does X" observed in there is not evidence that nothing does X. Check the built image.

    - |-
      #
      # Turn the periodic apt machinery on, and say what "unattended" means on a machine that runs
      # prints for hours at a time.
      #
      # 20auto-upgrades is the switch, and it is written here BYTE FOR BYTE as the package ships it
      # (usr/share/unattended-upgrades/20auto-upgrades - checked, not guessed). The package does
      # install it on its own: the debconf question defaults to true and is asked at priority low,
      # so a noninteractive chroot keeps the default and the postinst writes the file. This is
      # belt and braces against that default ever flipping, which would leave the package installed,
      # the timers running and nothing ever upgraded - a failure indistinguishable from success
      # without going and looking, which is the worst shape a security feature can have.
      #
      # Identical content matters, because the postinst registers that file with ucf. Anything of
      # ours in it would show up as a local modification at the next upgrade of the package, so our
      # own preferences go in the 52- file below instead, which nothing else owns.
      #
      # A 52- drop-in rather than editing 50unattended-upgrades, which the package owns and replaces
      # on its own upgrade. It sets scalars only, and inherits Debian's shipped Origins-Pattern:
      #
      #   origin=Debian,codename=trixie,label=Debian            <- the stable archive
      #   origin=Debian,codename=trixie,label=Debian-Security
      #   origin=Debian,codename=trixie-security,label=Debian-Security
      #
      # So it is stable and its security updates - point releases included, which is conservative
      # and right for an appliance - and NOT trixie-updates, which Debian ships commented out.
      #
      # download.docker.com is allowed too, and the argument for excluding it turned out not to
      # survive checking. It was that a docker-ce upgrade restarts the daemon, stopping every
      # container, and that doing so mid-print destroys the print. The second half is false: a
      # Prusa printer prints from its own storage, and this board only ever *transferred* the file
      # to it (PrusaConnect.Transfers.FileTransferContent). A daemon restart costs an in-flight
      # transfer, which is retryable, and a monitoring gap of seconds - not somebody's eight hours.
      #
      # Against that: docker-ce and containerd.io are the most privileged userspace on this card,
      # they run as root, and their CVEs are the container-escape kind. Excluded, they would be
      # frozen at whatever the card shipped with for the life of the board - the same trap as the
      # Raspberry Pi archive, on a component where it matters more. Debian's docker.io is not an
      # option here either: rpi-image-gen's docker layer installs from download.docker.com, so this
      # origin is the only source of a fix that exists.
      #
      # Not paired with live-restore in /etc/docker/daemon.json, which is the documented way to keep
      # containers running across a daemon upgrade and was considered. It covers patch releases only
      # - Docker's own documentation says "not for major (YY.MM) daemon upgrades" - and it changes
      # what happens to containers at shutdown, which is a thing to verify on hardware rather than
      # assume. Buying a few seconds a handful of times a year with an untested change to daemon
      # shutdown semantics is the wrong way round. Worth revisiting with a board to test on.
      #
      # archive.raspberrypi.com is added below, and the reason is not the obvious one. It does NOT
      # make Debian's updates reachable for the packages Raspberry Pi rebuilds: their versions carry
      # a +rpt suffix that outranks Debian's own by dpkg ordering, permanently. Checked rather than
      # reasoned - `dpkg --compare-versions 2.41-12+rpt1+deb13u3 gt 2.41-12+deb13u4` is true - so
      # when Debian issues the next glibc revision, this card will not take it whatever is allowed
      # here. That is a shadowing problem and no origin list can solve it.
      #
      # What allowing this origin does solve is that those packages have otherwise NO update path at
      # all. 38 of the ~300 installed come from here, 15 of them shadowing a Debian package, and
      # with the origin excluded they are frozen at whatever the card was written with, for the life
      # of the board - libc6, libc-bin, libasound2t64, libdrm2 among them. Allowed, they move when
      # Raspberry Pi rebuilds. The residual gap is honest and unfixable from here: glibc tracks
      # Raspberry Pi's cadence rather than Debian's, and pinning Debian's above theirs would fight
      # the vendor whose patches this board runs on.
      #
      # apt list values APPEND, which is what makes adding an origin a two-line change - and is also
      # the trap for anyone trying to *narrow* them. Restating Debian's patterns here to trim one
      # would add a fourth, not replace three.
      #
      # Origin and Codename below are the RPi archive's own Release fields, read from
      # archive.raspberrypi.com/debian/dists/trixie/Release rather than guessed.
      set -eu
      printf '%s\n' \
        'APT::Periodic::Update-Package-Lists "1";' \
        'APT::Periodic::Unattended-Upgrade "1";' \
        > $1/etc/apt/apt.conf.d/20auto-upgrades

      printf '%s\n' \
        '// Raspberry Pi'"'"'s archive and Docker'"'"'s, added to Debian'"'"'s three. Both ship packages that' \
        '// no Debian suite can supersede - a +rpt version outranks Debian'"'"'s forever, and docker-ce' \
        '// exists in no Debian suite at all - so excluding either freezes it for the life of the' \
        '// board. Origin and Codename are each archive'"'"'s own Release fields, read rather than' \
        '// guessed. See the layer for why this does not make Debian'"'"'s glibc reachable.' \
        'Unattended-Upgrade::Origins-Pattern {' \
        '        "origin=Raspberry Pi Foundation,codename=${distro_codename}";' \
        '        "origin=Docker,codename=${distro_codename}";' \
        '};' \
        '' \
        '// Nothing is blacklisted. An earlier version excluded the kernel, the bootloader and the' \
        '// EEPROM packages, and the trade was the wrong way round: it accepted a board running a' \
        '// kernel with known holes for its whole life to avoid a rare, unlucky write. The security' \
        '// cost is certain and permanent; the availability risk it bought is neither.' \
        '//' \
        '// The risk was not imaginary. The boot partition is FAT with no journal, so a write torn by' \
        '// a power cut is a board that does not come back, where the same accident on the journalled' \
        '// root is a dpkg --configure -a over SSH. That distinction is real. What is not real is a' \
        '// blacklist delivering it.' \
        '//' \
        '// Traced on a built card rather than reasoned: /boot is on the ext4 root, and the only' \
        '// thing that writes the FAT partition is raspi-firmware'"'"'s hooks, which rsync the kernel,' \
        '// DTBs, overlays and initramfs across. Those hooks are files on disk. They run whenever' \
        '// anything activates the update-initramfs trigger - udev, kmod, busybox, dmsetup,' \
        '// klibc-utils and e2fsprogs all do, and every one is a Debian package in an origin that' \
        '// was always allowed. So a routine udev security update rewrites that partition with or' \
        '// without a blacklist; blacklisting a package stops it being upgraded and does nothing to' \
        '// a dpkg trigger fired by something else.' \
        '//' \
        '// rpi-eeprom was in the list for the same reason and was never the thing that flashes. Its' \
        '// postinst installs blobs under /lib/firmware and enables rpi-eeprom-update.service, which' \
        '// this card already runs at every boot as -s -a: it stages pieeprom.upd onto the FAT' \
        '// partition and the ROM flashes at the next boot. That path never went through apt.' \
        '//' \
        '// And the exclusion contradicted the premise. This whole file exists because nobody logs' \
        '// into an appliance - so "a kernel would sit unused until a person acted" does not describe' \
        '// a deferral, it describes a kernel that is never installed for the life of the board.' \
        '// That is the trap the origins above were opened to escape, and it is worst on the one' \
        '// package where frozen-forever is hardest to defend.' \
        '//' \
        '// What is paid for this: a kernel upgrade rsyncs two images, the DTB set and the overlays' \
        '// across FAT, which is a bigger write than an initramfs refresh and happens per kernel' \
        '// release. It is a wider window on a risk the card already carries, not a new one.' \
        '' \
        '// It never reboots by itself, and that is the decision this file exists to make. A print' \
        '// runs for hours and dies with the machine, so a board that reboots when it judges the' \
        '// moment right will eventually throw away somebody'"'"'s eight-hour job to install a libc' \
        '// nobody was waiting for. Updates that need a reboot wait for a person instead.' \
        '//' \
        '// The cost is real and stated rather than hidden: a kernel or an openssl whose services' \
        '// were not restarted sits installed and unused until that reboot. A kernel says so in' \
        '// /var/run/reboot-required, written by unattended-upgrades'"'"' own kernel postinst hook -' \
        '// which is a thing that happens now that kernels are not excluded. An openssl does not:' \
        '// nothing on this card writes that file for a library, so pi/README.md recommends a reboot' \
        '// on a cadence rather than a check for one.' \
        'Unattended-Upgrade::Automatic-Reboot "false";' \
        '' \
        '// The card is finite and nothing prunes it otherwise, and with nothing blacklisted both of' \
        '// these are load-bearing. Downloaded .debs are what this path accumulates day to day; old' \
        '// kernels are what accumulates in hundreds of megabytes, and this card installs them' \
        '// unattended now, so the pruning is what keeps a 30 GB card from filling with them.' \
        'Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";' \
        'Unattended-Upgrade::Remove-New-Unused-Dependencies "true";' \
        'APT::Periodic::AutocleanInterval "7";' \
        '' \
        '// Smaller dpkg transactions, so a power cut during an upgrade leaves less half-done. An' \
        '// appliance loses power the way a laptop does not: at the wall, without warning.' \
        'Unattended-Upgrade::MinimalSteps "true";' \
        '' \
        '// Into the journal, which is where everything else on this board is debugged from. There' \
        '// is no MTA here, so the mail unattended-upgrades would otherwise send goes nowhere.' \
        'Unattended-Upgrade::SyslogEnable "true";' \
        > $1/etc/apt/apt.conf.d/52homespool-unattended-upgrades

      chmod 0644 $1/etc/apt/apt.conf.d/20auto-upgrades \
                 $1/etc/apt/apt.conf.d/52homespool-unattended-upgrades

    - |-
      #
      # Undo raspberrypi-sys-mods' rfkill policy. It ships `options rfkill default_state=0`, so the
      # radio comes up blocked - correct for Raspberry Pi OS, where their own first-boot tooling
      # lifts it after an operator picks a country, and wrong here, where none of that exists and
      # the block simply never lifts.
      #
      # zz- so it sorts after rfkill_default.conf: modprobe reads /etc/modprobe.d in order and the
      # last setting of a parameter wins. Belt and braces with the explicit `rfkill unblock` in
      # homespool-wifi.sh, because relying on filename ordering alone to defeat another package's
      # policy is the sort of thing that quietly stops working.
      set -eu
      printf '%s\n' 'options rfkill default_state=1' > $1/etc/modprobe.d/zz-homespool-rfkill.conf

    - |-
      #
      # zram's configuration, copied from the board it was proven on rather than invented here.
      #
      # zram-size = ram is the whole of RAM, which sounds reckless and is not: the device fills only
      # as pages are compressed into it, and those pages are accounted as used memory, so the
      # kernel's own pressure feedback still applies. It self-scales across every board this image
      # supports, which is why no per-model condition is needed.
      #
      # zstd rather than lz4 or lzo, for the ratio - 3.8x measured on this workload. Stated
      # explicitly even though CONFIG_ZRAM_DEF_COMP is already "zstd" in both the v8 and 2712
      # kernels (checked, both carry CONFIG_ZRAM_BACKEND_ZSTD), because a config that silently
      # depends on a kernel default is a config that breaks when the default moves.
      set -eu
      printf '%s\n' \
        '[zram0]' \
        'zram-size = ram' \
        'compression-algorithm = zstd' \
        > $1/etc/systemd/zram-generator.conf

    - |-
      #
      # The two sysctls that make zram behave, and both are the opposite of what you would set for
      # disk-backed swap.
      #
      # swappiness = 150 - well above the default 60, on a scale to 200 - because the usual reason to
      # discourage swapping is that the backing store is slow. Here it is RAM, so being eager is
      # correct: a compressed cold page is strictly better than an evicted one.
      #
      # page-cluster = 0 disables swap readahead entirely. Readahead exists to amortise seek latency,
      # zram has none, and reading ahead means decompressing pages nobody asked for - pure CPU cost
      # on the boards least able to afford it.
      set -eu
      printf '%s\n' \
        'vm.swappiness = 150' \
        'vm.page-cluster = 0' \
        > $1/etc/sysctl.d/99-zram.conf

    - |-
      #
      # A console font you can actually read. The default is Fixed 8x16, which on a 4K panel is 480
      # columns of ants - and the console is exactly the thing you are looking at when something has
      # gone wrong badly enough that SSH is not an option, so it being unreadable costs most when it
      # matters most.
      #
      # 16x32 glyphs, the largest Terminus shipped. The trade is real and was weighed rather than
      # waved through: it gives 240x67 at 2160p and 120x33 at 1080p, but only 80x22 at 720p - three
      # rows short of a VGA console's 80x25. Henrik's call, and the right one, since a smaller-panel
      # user loses three rows while a 4K user currently loses the display entirely.
      #
      # CODESET stays "guess", which adapts to the locale where pinning Lat15 would impose a Western
      # European assumption on an image anyone can flash.
      #
      # Terminus does not cover every codeset at this size, and the exact list matters more than the
      # generalisation: 32x16 exists for Lat15, Lat2, Lat7, Lat38, Uni2, Uni3, Vietnamese, Hebrew,
      # Greek and the Cyrillic sets - and NOT for Uni1, Arabic, Armenian, Ethiopic, Georgian, Lao or
      # Thai. Terminus is a Latin/Greek/Cyrillic typeface, so that is a property of the font rather
      # than an oversight.
      #
      # This image ships LANG=C.UTF-8, so the guess lands on a Latin set and the font is present. A
      # user who switches to one of those seven locales would not get it. What setupcon does then -
      # fall back quietly or complain - is NOT verified here, and is worth finding out before anyone
      # claims this is safe for all locales rather than merely for the one we ship.
      #
      # Uni2 is Latin + Slavic Cyrillic + Greek; Uni3 is Latin + Slavic and non-Slavic Cyrillic.
      # Either would be a defensible pin if "guess" ever proves troublesome.
      #
      # sed on the file rather than debconf-set-selections: console-setup's postinst has already run
      # by the time customize-hooks execute, so it has already written this file from its debconf
      # answers - setting them now would need a dpkg-reconfigure to have any effect. Nothing at image
      # generation regenerates /etc/default/*, unlike the fstab and hostname traps above. Verified in
      # the built image regardless, because that is the rule this layer learned twice.
      #
      # No existence guard on purpose. If the file is ever absent, sed fails, set -e aborts the build
      # and somebody finds out - which is strictly better than a hook that silently does nothing, the
      # failure mode that hid the resize bug for a day.
      #
      # console-setup.service is already enabled by the package (multi-user.target.wants), as is
      # keyboard-setup.service (sysinit.target.wants) - checked, not assumed, because rpi-resize
      # taught us that shipping a unit and enabling it are different things.
      set -eu
      sed -i 's/^FONTFACE=.*/FONTFACE="TerminusBold"/; s/^FONTSIZE=.*/FONTSIZE="32x16"/' \
          $1/etc/default/console-setup

    - |-
      #
      # Turn the root-partition resize on. raspberrypi-sys-mods' initramfs script is gated on the
      # word "resize" being on the kernel command line, and does nothing without it.
      #
      # Appending to cmdline.txt is safe *here specifically*, unlike the hostname and fstab hooks
      # this file used to carry, which a later stage silently regenerated. Image generation edits
      # this file rather than rewriting it - image/mbr/simple_dual/setup.sh replaces only the root=
      # token with a sed - so everything else on the line survives. Verified in the built image, not
      # assumed, because this project has now been caught by that exact difference twice.
      #
      # sed on line 1 rather than >>, because cmdline.txt is a single line and an appended line is
      # ignored in silence: the kernel reads the first line and nothing reports the rest.
      set -eu
      CMDLINE=$1/boot/firmware/cmdline.txt
      if ! grep -qw resize "$CMDLINE" ; then
         sed -i '1 s/$/ resize/' "$CMDLINE"
      fi

    - |-
      #
      # Regenerate the initramfs so it carries resize_early, plus the lsblk and parted the package's
      # own hook copies in for it. Explicit rather than relying on the package's triggers firing in
      # the right order relative to the rest of the build - it is idempotent, and a missing script
      # here fails by quietly never resizing.
      set -eu
      chroot $1 update-initramfs -u -k all

    # No password-expiry hook here any more, and its absence is the point rather than an omission.
    # It ran `chage -d 0` so the first login had to choose a new password, which was the entire
    # mitigation for a stock password baked into every card. There is no stock password now - see
    # pi/build.sh, which explains why expiry was never the mitigation it looked like - so every
    # password this account can have was chosen by its owner, and demanding they choose a second one
    # at first login would ask for nothing and cost an SSH session.

    # No hostname hook here on purpose. device-base already owns /etc/hostname, defaulting it to
    # "${device_class}-<six random letters>" - so a hook that writes the name we want runs *before*
    # that and is silently overwritten, which is how the first build shipped a board called
    # "pi3-pjgxel" with a README promising homespool.local. It is set as device.hostname in
    # config/homespool.yaml instead, which is the variable that layer actually reads.

    - |-
      #
      # An authorised key for the device user, when one was supplied. Without this and without
      # device_user1pass the account is locked - rpi-image-gen's default, and a deliberate one, but
      # it means a headless board you cannot reach.
      set -eu
      if [ -n "${IGconf_homespool_sshkey:-}" ] ; then
         home=$1/home/$IGconf_device_user1
         mkdir -p $home/.ssh
         cp "$IGconf_homespool_sshkey" $home/.ssh/authorized_keys
         chmod 700 $home/.ssh
         chmod 600 $home/.ssh/authorized_keys
         chroot $1 chown -R $IGconf_device_user1:$IGconf_device_user1 /home/$IGconf_device_user1/.ssh
      fi

    # Enabled, not started - there is no running systemd in a chroot. They run on the real board.
    - chroot $1 systemctl enable homespool-firstboot.service
    - chroot $1 systemctl enable homespool-wifi.service
    - chroot $1 systemctl enable homespool-login.service

    # Both halves of the update cycle, and neither is assumed. apt ships these enabled by preset,
    # but presets are exactly what this layer has been caught by before - rpi-resize shipped a unit
    # nobody had enabled - and enabling an already-enabled unit costs nothing. apt-daily refreshes
    # the package lists; apt-daily-upgrade is the one that runs unattended-upgrade. Without the
    # first the second has nothing to act on.
    - chroot $1 systemctl enable apt-daily.timer
    - chroot $1 systemctl enable apt-daily-upgrade.timer

    # The filesystem half of the resize, and it does NOT come enabled with the package - checked in
    # a built image, where the initramfs had grown the partition and nothing then grew the ext4
    # inside it.
    #
    # Enabling rpi-resize rather than systemd-growfs-root.service, which is what actually does the
    # work: growfs has no [Install] section at all and cannot be enabled directly. rpi-resize exists
    # to be the installable wrapper - its ExecStart is /usr/bin/true and its whole purpose is the
    # Wants= that pulls growfs in. It is ConditionFirstBoot=yes, which holds here because mmdebstrap
    # leaves /etc/machine-id empty, and it disables itself after one run.
    - chroot $1 systemctl enable rpi-resize.service
