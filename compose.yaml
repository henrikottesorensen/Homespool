# Bounds every service's container log. Docker's default json-file driver keeps no size limit and
# never rotates, so each service appends to one file for the life of its container, however long
# that is - unbounded disk, and a steady stream of small writes on hardware that wears out by being
# written to. A Raspberry Pi's SD card is the case that motivated it; a server merely runs out of disk
# more slowly.
#
# Here rather than in /etc/docker/daemon.json because this file travels with the stack to every
# deployment, where a daemon default would reach only an image that shipped one.
#
# What it changes is how much is KEPT, not how much is written: the same bytes still land, and the
# oldest are discarded past 10 MB x 3 per service. `docker logs` goes on working as before.
#
# Applied per container at creation, so an existing deployment picks it up on the next
# `docker compose up -d`, which recreates each service whose configuration changed.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  homespool:
    logging: *logging
    # REGISTRY prefixes both image names, for a deployment that pulls rather than builds - set it in
    # .env and nothing here changes. Unset, which is the ordinary case, this is plain `homespool`.
    image: ${REGISTRY:+${REGISTRY}/}homespool
    build:
      context: .
      dockerfile: Homespool.Host/Dockerfile
      args:
        # The commit to stamp into the image, which `docker compose build` CANNOT FILL IN: compose
        # does no command substitution, so this is only ever whatever the environment already holds.
        # ./build.sh is the wrapper that computes it and calls compose; use that if the image is going
        # anywhere. Empty is supported and means --version reports an unknown commit.
        HOMESPOOL_GITREF: "${HOMESPOOL_GITREF:-}"

    # Pinned, because Docker otherwise derives it from the container id - a new name on every
    # recreation. The printer certificate carries this name and is issued once, so an unpinned name
    # would churn between reissues and go stale the moment the container is replaced; pinning also
    # keeps the provisioning page able to recognise it (the resolve-to-judge rule) and the logs
    # saying "homespool" rather than a hex id.
    hostname: homespool

    # NOTHING is published from this container. The listeners - people on 8080, printers on 15443,
    # transfers on 15080, plus the legacy plaintext printer port 15800 when it is asked for - stay
    # inside this network, so from OUTSIDE it the proxy below is the only way to any of them. That is
    # what makes X-Real-IP worth trusting when the proxy writes it: a client that could reach Kestrel
    # directly could simply write that header itself.
    #
    # The header is trusted from the proxy's network, and that network holds the proxy and this
    # container and NOTHING ELSE - which is what makes trusting it the same as trusting the proxy.
    # The sidecars are on networks of their own: go2rtc runs third-party code and fetches addresses
    # people give it. Docker networks are symmetric, so it could reach back over the camera network -
    # except that the listeners bind only the interface on this network and loopback (see the
    # networks: line below), so there is no socket of ours there for it to find. Not an address: the
    # proxy's address is Docker's to hand out, and a trust pinned to a predicted address either fails
    # to start or trusts nobody the day the prediction is wrong.
    #
    # The printer port is not served TLS from here because .NET cannot serve that TLS correctly:
    # SslStream emits records far larger than the kilobyte of plaintext the firmware holds - a real
    # limit the printer never advertises - and file transfers fail. nginx (OpenSSL) can be capped;
    # see nginx/homespool-printer.conf.
    #
    # To read the printer wire in the clear, set LEGACY_PRINTER_PORT and provision ONE printer with a
    # legacy bundle rather than adding a port here: the protocol then crosses port 15800 in plain
    # HTTP for that printer alone, and every other keeps TLS.

    # So that a mail server on the HOST is addressable the same way everywhere: Docker Desktop
    # resolves host.docker.internal on its own, plain Linux Docker does not - without this line
    # "my mail server runs on this machine" works on a Mac and fails with "connection refused" on
    # the server somebody actually deploys to.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Compose reads .env only for ${...} substitution: a variable not mapped in this block never
    # reaches the container at all. Setting an App__Key directly in .env does nothing, silently.
    environment:
      # What is NOT here: everything an administrator changes from the application. Mail, retention,
      # upload and attempt limits, the camera timings and the STUN address now live in
      # data/settings.json on the mounted volume, written by the settings page - so they survive a
      # compose edit and can be changed without a redeploy. They were removed from here rather than
      # left as a fallback: two homes for one setting means a winner nobody can see. What remains
      # below is what must agree with this file - published ports, volume paths, the sidecar's
      # address - plus the credentials a page has no business holding.
      # The zone every timestamp a person reads is rendered in - rendering is server-side
      # (ToLocalTime), so a container left on the UTC default shows people UTC times. Presentation
      # only: stored times are DateTimeOffset in Unix milliseconds and unaffected.
      TZ: "${TZ:-UTC}"

      # Point SQLite at the mounted volume. appsettings.json keeps a relative path so that
      # running outside a container still works.
      ConnectionStrings__HomespoolDb: "Data Source=/app/data/Homespool.Sqlite"


      # Cameras. The sidecar is addressed by service name on this network; nothing about a camera
      # itself is configured here, because Homespool registers cameras with the sidecar itself.
      Cameras__StreamServerBaseUrl: "${CAMERA_STREAM_SERVER_BASE_URL:-http://go2rtc:1984}"

      # The username half of the pair the go2rtc service is started with, from the same .env value -
      # one source, two readers, so they cannot disagree. The password half is a secret and arrives
      # as a file; see the secrets: block below. Empty password means the sidecar is
      # unauthenticated, which is what a deployment that never published its port already had.
      Cameras__ApiUsername: "${GO2RTC_USERNAME:-}"

      # An override for the address a browser is told to send WebRTC media to, and empty is the
      # ordinary case: Homespool derives it by resolving PrinterHost - the only route to this
      # machine's real address from inside a container - and writes it to the sidecar at startup.
      # Set it when that derivation cannot be right: a router forwarding a port inward, a tunnel,
      # anything where the address a browser must use is not the address this machine has.
      Cameras__WebRtcCandidate: "${WEBRTC_CANDIDATE:-}"

      # The published side of the sidecar's media port, which is the number a browser connects to and
      # therefore the one that belongs in the candidate. Same variable the go2rtc service publishes
      # with, so the address Homespool writes and the port Docker opens cannot drift apart. Ignored
      # when WEBRTC_CANDIDATE names a port of its own.
      Cameras__WebRtcPort: "${WEBRTC_PORT:-8555}"


      # Which peers may speak for the client - everything on the proxy's network, which is the proxy
      # and nothing else; see the networks block at the bottom for the rule that keeps it so. The
      # same range Docker allocates the network from, and setup-env.sh moves the two together. Empty
      # would mean the middleware is not registered at all, and links in outgoing mail would say
      # http:// while every logged client address was the proxy's.
      XForwarded__KnownNetworks__0: "${PROXY_NETWORK:-172.28.0.0/16}"

      # Which addresses exist only in here, so the provisioning page does not offer an address no
      # printer on your network can route to. The network's own range, which is also what the
      # camera source policy refuses as a destination.
      Certificates__ContainerNetworks__0: "${PROXY_NETWORK:-172.28.0.0/16}"

      # docker0 is on every Docker host whether or not anything uses it, and its gateway address is
      # one this machine's name can resolve to - so without this it passes as an address a printer
      # could reach, and lands in the printer certificate and on the bundle page. Docker's stock
      # range; a daemon.json that moves it needs this moved too. Other projects' bridges are not
      # known here and are not guessed at.
      Certificates__ContainerNetworks__1: "172.17.0.0/16"

      # The two sidecar networks below, for the same reason: each is a bridge whose gateway address
      # this machine's name resolves to, and a range the filter does not know lands in the printer
      # certificate. Fed from the same variables the networks are allocated from, so they cannot
      # drift.
      Certificates__ContainerNetworks__2: "${CAMERA_SUBNET:-172.29.0.0/16}"
      Certificates__ContainerNetworks__3: "${CERTS_SUBNET:-172.30.0.0/16}"

      # The passphrase encrypting the printer CA's private key is NOT here: it is a secret and
      # arrives as a file, like the sidecar's credential. See the secrets: block below.

      # Which Host headers this process answers at all - the proxy refuses an unknown Host, and this
      # is the same rule inside the application, because a proxy is not the only way to reach it.
      # Composed from the names this deployment already knows, and it is the floor rather than the
      # whole list:
      #
      #   USER_HOSTS    what people browse to - itself a list, which is why this composes cleanly
      #   PRINTER_HOST  what printers are told to connect to
      #   localhost     the container health check, which curls itself
      #
      # The printer side is not maintained here. The application appends every name on the printer
      # certificate, at startup and again whenever it is reissued: a printer can only complete a
      # handshake against a name the leaf covers, so the leaf's names are exactly the Host values a
      # printer can present, and the two cannot drift. A bundle addressed to this machine's bare
      # address works without that address appearing in either variable.
      #
      # SEMICOLONS, not commas - the framework's separator, and the reason USER_HOSTS uses one too:
      # its names need no conversion to be spliced in here. The match ignores the port. A name
      # people browse to that is in neither variable is refused with 400 before anything else runs,
      # so add it to USER_HOSTS rather than here - this line is composed, not maintained.
      #
      # This takes USER_HOSTS RAW, where the proxy takes it filtered: 16-user-server-names.envsh
      # drops any name outside a hostname character set, so a name that is here and not there gets no
      # server block, and an unmatched Host is answered 444 by the default server before this list is
      # ever consulted. Nothing is lost by the difference - the entry is simply inert - and closing it
      # would mean teaching compose the same character set, which is the drift the proxy's own
      # derivation exists to prevent.
      AllowedHosts: "${USER_HOSTS:-localhost};${PRINTER_HOST:-localhost};localhost"

      # PrinterHost is what a printer is told to use: required for USB-key provisioning - the Add
      # printer page refuses to produce an ini snippet without it - and should be one of the names
      # in the certificate, which it is by construction if set before the first start. PrinterPort
      # must match the proxy's published printer port below - it is the number written into every
      # provisioning bundle. PrusaConnect__PrinterTls is deliberately NOT set here and takes the
      # application's default, true: false is the mode for running the application with nothing in
      # front of it (the test factory, the rigs), and in this stack it would leave the proxy
      # publishing a printer port it has no leaf to serve. To read the wire in the clear, use
      # LEGACY_PRINTER_PORT below.
      PrusaConnect__PrinterHost: "${PRINTER_HOST:-}"
      PrusaConnect__PrinterPort: "${PRINTER_PORT:-15443}"

      # The legacy plaintext printer listener, and EMPTY BY DEFAULT - which binds to null and means the
      # socket is never opened. Set LEGACY_PRINTER_PORT only if you own a printer whose firmware
      # cannot load a custom certificate; every printer provisioned onto it sends its token, its
      # files, and the WiFi SSID and PrusaLink password it reports in its own INFO, across the
      # network in clear - and plain HTTP has no integrity, so gcode and commands can be altered in
      # flight rather than only read.
      # It leaves TLS standing for every other printer, which is the whole reason it exists as a
      # second listener rather than a switch - and it is also how to read the printer wire in the
      # clear: one printer on a legacy bundle, captured on this port.
      #
      # ONE VARIABLE, read three times here, so the listener, the number written into a legacy ini
      # and the proxy's server block cannot disagree about whether the listener exists or where it is.
      #
      # The two halves are the same split PrinterPort already has, and they are not the same number
      # when the host port is moved: Listeners is the port INSIDE this container - fixed, because the
      # server block in front of it is a static file - and PrusaConnect is what a printer DIALS, which
      # is the published port and goes into the ini. `:+` yields the fixed port only when the variable
      # is set at all, so unset means an empty string, which binds to null and opens nothing.
      Listeners__LegacyPrinterPort: "${LEGACY_PRINTER_PORT:+15800}"
      PrusaConnect__LegacyPrinterPort: "${LEGACY_PRINTER_PORT:-}"

      # The port written into START_ENCRYPTED_DOWNLOAD - what a printer on the pre-websocket transport
      # fetches a file from. Plain HTTP by design (the printer opens it with a raw socket; see
      # nginx/homespool-transfer.conf), so it is proxied without TLS and stays plain whichever
      # printer listener the printer came in on. Same variable as the proxy's published port below,
      # so they cannot drift.
      PrusaConnect__TransferPort: "${TRANSFER_PORT:-15080}"


    volumes:
      - homespool-data:/app/data

      # A separate volume from the one above, deliberately - it holds only what is safe to hand
      # the network-facing container. See the volumes block at the bottom.
      - homespool-printer-leaf:/app/data/proxy-certificates

      # Camera *names*, deliberately not camera access: udev's stable symlinks are listable in
      # here, but opening any of them is refused, because this service is granted no
      # `device_cgroup_rules` - the camera service below is. Measured 2026-08-29: with /dev mounted
      # and no rule, opening /dev/video0 fails "Operation not permitted"; add `c 81:* rmw` and it
      # succeeds. The mount carries names; the cgroup carries capability; only the sidecar has it.
      #
      # THE WHOLE OF /dev, not /dev/v4l/by-id and by-path, and that is the fix for a real defect
      # rather than a convenience (2026-08-29). udev rmdir's and mkdir's those subdirectories
      # whenever the device set changes, and a bind mount pins the inode it found at container
      # start - so after any USB change this service was reading a stale, orphaned, empty directory
      # while the camera sat working in the sidecar. No error, no log line: just a blank camera
      # picker, and a camera that cannot be re-added until someone restarts the container. Mounting
      # the filesystem root instead is immune, because /dev is the root of a devtmpfs and cannot be
      # unlinked, so lookups beneath it always resolve live.
      #
      # Mounted at /hostdev, NOT over /dev, and that is the point: this container keeps the
      # private /dev Docker builds it - the curated handful of entries, its own /dev/shm and
      # /dev/pts - and gets the host's device tree beside it rather than instead of it. Mounting
      # over /dev would replace all of that and then need /dev/shm handing back as a tmpfs, which
      # is three moving parts to solve a problem that has one.
      #
      # Read-only, because reading symlink names is the whole of what this service does with it.
      #
      # Read-only is not the same as narrow, and `recursive: disabled` is the narrowing. A bind mount
      # is recursive unless told otherwise, so the short form brought along every filesystem mounted
      # beneath the host's /dev - /dev/shm, /dev/pts and /dev/mqueue - and /dev/shm is where other
      # processes on the host keep ordinary files, readable in here by whatever their modes allow.
      # Without recursion those three are the empty directories they are mounted over, and what is
      # left is the devtmpfs itself: device nodes, and udev's symlinks, which live on it.
      #
      # It costs the fix above nothing, because that fix rests on binding the ROOT of the devtmpfs
      # and recursion does not enter into it. Measured on a Pi with a USB camera, in a container
      # started before the camera was unplugged and plugged back in: udev recreated by-id under a
      # new inode, and the container listed the new one.
      #
      # The long form is the only spelling: the short one has no option for this.
      - type: bind
        source: /dev
        target: /hostdev
        read_only: true
        bind:
          recursive: disabled

    # The two credentials this container holds, as files rather than environment variables. Each
    # file is named for the configuration key it fills, and the application reads the directory with
    # the key-per-file provider: Certificates__AuthorityPassphrase becomes
    # Certificates:AuthorityPassphrase, and a missing file is a key nobody set - which is the same
    # empty value the environment used to carry, so every refusal below reads as it always did.
    #
    # What it buys: the values are gone from the container's environment, from `docker inspect`, and
    # from any child process's inherited environment. What it does not buy is anything against
    # something running INSIDE this container, which can read the files exactly as the application
    # does - the uid below is the application's own.
    #
    # The values still come from .env, so nothing about deploying changes. Compose reads each one
    # from its own process environment and writes the file into the container: no host file to
    # create, own or keep in step, and the mode and owner below are honoured (a secret with a
    # `file:` source silently keeps the host file's owner instead, which a container that is not
    # root then cannot read).
    #
    # A VARIABLE THAT IS NOT SET AT ALL FAILS `docker compose up`, naming the variable and the
    # secret. `down`, `ps` and `config` keep working, so the deployment is not stuck. setup-env.sh
    # generates both, and .env.example documents them; a deployment that wants no cameras still
    # needs a GO2RTC_PASSWORD line, empty if it likes. Set-but-empty mounts no file at all, and is
    # how "no credential" is spelled.
    # 1654 is the uid the image runs as - APP_UID in the aspnet base image, and what the Dockerfile's
    # USER line takes. A file this user cannot read is a key nobody set.
    secrets:
      # The sidecar's API credential, the same value go2rtc itself is given below.
      - source: go2rtc-password
        target: Cameras__ApiPassword
        uid: "1654"
        mode: 0400

      # Encrypts the printer CA's private key on the data volume, and the certificate behind the
      # sign-in key ring with it. That the value lives in .env - outside that volume - is the point:
      # a copied data/ backup alone then carries neither the key every provisioned printer trusts
      # nor the means to mint a session. Required: without it the server refuses to start rather
      # than store either key in the clear. Never change or drop it once set; the server likewise
      # refuses rather than mint a replacement CA that would strand the fleet.
      - source: ca-passphrase
        target: Certificates__AuthorityPassphrase
        uid: "1654"
        mode: 0400

    # This is the container that parses what printers send and what people upload, so it keeps no
    # privilege it does not use - and it uses none. The image already runs as an unprivileged user
    # with no effective capabilities; what these two add is that nothing in here can acquire any.
    # Dropping the bounding set means no binary can be run with a capability whatever its file says,
    # and no-new-privileges means a setuid binary runs as the caller. Measured, not assumed: the
    # application starts, migrates, mints its certificates, serves pages, takes uploads and reads
    # both secrets above under the pair exactly as without it.
    #
    # One thing changes for whoever debugs it: `docker exec -u 0` gives a root with no capabilities,
    # which cannot read files the application owns privately - the authority's key among them.
    # `docker cp` is unaffected.
    #
    # NOT read_only, for the reason the sidecar below is not: compose cannot write a secret sourced
    # from the environment into a read-only service at all - it refuses with "`file` is the sole
    # supported option" - and a `file:` secret would put the authority's passphrase in a file on
    # the host. The flag would buy little here anyway: the image's files are root's and this user
    # cannot write them. What it does write outside the volumes is /tmp - the runtime's diagnostic
    # sockets, and every form upload past the memory threshold, which ASP.NET spills there. Should
    # read_only ever return, /tmp has to stay writable AND ON DISK: without it an upload answers 400
    # with nothing logged while the container reports healthy, and a tmpfs would hold an upload of
    # up to the configured limit in memory, which a Raspberry Pi does not have.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

    # Two networks: the proxy's, and the camera sidecar's. The sidecar is reached by service name
    # over the second, and is on nothing else - see its own networks: line. The listeners bind only
    # the interface on the first (the one inside XForwarded__KnownNetworks) and loopback, so the
    # sidecar has no socket of ours to reach back to: a Docker network is symmetric, and this is
    # what makes the second one one-way.
    networks:
      - homespool
      - homespool-cameras

    # The outermost of three shutdown budgets and the only one Docker enforces: SIGTERM, then
    # SIGKILL after this. The app's own two - TelemetryWriter's final flush and
    # HostOptions.ShutdownTimeout - are sized to finish inside it pinned by 
    # TelemetryWriterShutdownBudgetTests). Raise it if a deployment ever needs a longer drain;
    # never lower it below the app's own timeout, or the SIGKILL lands mid-flush
    # and the report of what was lost is lost with it.
    stop_grace_period: 15s

    # No healthcheck block is needed: the image declares one against /health/live, which answers
    # only for faults a restart would fix - it deliberately stays healthy while the database is
    # rejecting writes, because restarting would not fix that and would discard everything still
    # buffered. /health is the fuller report and the one to point monitoring at. Alert on /health;
    # never restart on it. A monitor is told the overall status and nothing more; the report behind
    # it goes to a signed-in administrator only, since it maps the deployment for whoever asks.

  # go2rtc reads cameras, so Homespool does not have to know how: go2rtc ingests RTSP, ONVIF, HTTP
  # and V4L2 and re-serves every one of them as a plain JPEG over HTTP,
  # which is why there is no camera protocol anywhere in the application.
  #
  # Homespool owns this container's configuration: cameras are added in Homespool, which registers
  # them here over the API. Do not edit go2rtc.yaml by hand - it is written by the sidecar itself,
  # and a camera described in two places is a camera described wrongly in one of them.
  #
  # Do not publish 1984: the API's one credential cannot say which streams a caller may see, so
  # every viewing path goes through Homespool, where the per-camera permission check lives.
  #
  # 8555 IS published, and it is the one exception: WebRTC media is SRTP straight from this
  # container to a browser and cannot be proxied by anything, so live view exists on this port or
  # not at all. Signalling still goes through Homespool like everything else, so the open port on
  # its own hands out nothing. Delete the ports block below to turn live view off; the still on the
  # printer page keeps working.
  go2rtc:
    logging: *logging
    # Pinned by digest: this is 1.9.14, the same digest pi/decode-bench.sh pins, so the sidecar
    # that runs is the sidecar that was measured. Upstream publishes no floating 1.9 or 1 tag, so
    # an exact pin is the only option that does not drift; bumping is manual and rare, and the
    # bench script's pin moves with this one.
    #
    # Plain, not -hardware: that variant is linux/amd64 ONLY and would not pull on a Pi at all.
    image: alexxit/go2rtc@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae  # 1.9.14

    # The credential is not in go2rtc.yaml, because Homespool rewrites that file when it registers a
    # camera, and it is not on the command line either, where every account on the host could read
    # it out of /proc/<pid>/cmdline: it arrives as a file of its own, and the command below says
    # how. It is one credential for the whole API - not the access control; Homespool still proxies
    # every viewing path and applies the per-camera check. It is required all the same: an
    # unauthenticated go2rtc runs command sources for anything that can reach it.
    #
    # So `listen` is empty unless a username is set, and an uncredentialled deployment then runs no
    # API at all rather than an open one. That is go2rtc's own rule made visible: it installs its
    # authentication middleware only when the username is non-empty, so this makes the API exist
    # exactly when something is checking it. Not `${VAR:?}`, which fails every compose subcommand
    # including `docker compose down` on a deployment that has not set it yet. Measured: with an
    # empty `listen` nothing binds 1984 and no "[api] listen" line appears; RTSP and WebRTC still
    # listen, and with no streams registered they serve nothing.
    #
    # local_auth applies the credential to requests reaching this API from inside this container
    # too. Without it go2rtc skips authentication entirely for anything arriving from 127.0.0.1, and
    # it follows HTTP redirects when it fetches a camera - so a camera address answering 302 with a
    # Location of this API arrives back here as an unauthenticated loopback request, creates a
    # stream, and runs ffmpeg with the arguments that redirect chose. Not publishing 1984 does not
    # help, because the request originates in here. Measured on 1.9.14: without it a loopback
    # request with no credential answers 200, with it 401, while a credentialled request from
    # either address still answers 200.
    #
    # GO2RTC_PASSWORD comes from .env and is given to both containers, so the two cannot drift.
    # An empty *username* is the off switch, and it has to be: measured 2026-08-09, a username with
    # an empty password turns authentication ON with an empty key and answers 401 to everything,
    # including Homespool. Set the pair together or not at all - half of it is worse than none.
    #
    # allow_paths lists exactly the endpoints Go2RtcClient calls. go2rtc applies the list by
    # never registering the
    # other paths with its mux, so a missing path answers a bare 404 - distinguishable from "no
    # such stream" only by the body: Go's mux says "404 page not found", a registered handler says
    # go2rtc's own "stream not found". Any new endpoint Homespool calls needs this list edited, and
    # nothing will tell you so.
    #
    # WITH A LEADING SLASH, and that is measured rather than read (Pi 3, go2rtc 1.9.14, 2026-08-17).
    # The source registers these as HandleFunc("api/streams", ...) and filters on that argument,
    # which reads as though the allowlist wants the bare form - it does not, and this comment said
    # the opposite until it was run. Without the slash EVERY path 404s, including the allowed ones,
    # so every camera stops working.
    #
    # /api/config and /api/restart cost what they say: restart stops every camera for anything
    # holding the credential, and config can carry a camera's RTSP password when its source embeds
    # one. What buys that back is Homespool owning the WebRTC candidate (WebRtcConfigurer) - an
    # address it did not write is one it could never check. What this list is NOT is closing a
    # remote-execution hole.
    command:
      - go2rtc
      - -c
      - /config/go2rtc.yaml
      - -c

      # Hardened, and the default deliberately: a fresh deployment is restricted without anyone
      # choosing it, and only a developer opts out. Nothing about webrtc is set here on purpose -
      # the candidate and ice_servers are written by Homespool over /api/config at startup, because
      # a value frozen into a command line cannot follow this machine's address. ice_servers
      # defaults to empty: left alone, go2rtc contacts a third-party STUN server unprompted.
      - '{"api":{"listen":"${GO2RTC_USERNAME:+:1984}","username":"${GO2RTC_USERNAME:-}","local_auth":true,"allow_paths":["/api/streams","/api/frame.jpeg","/api/stream.mjpeg","/api/webrtc","/api/config","/api/restart","/api/ffmpeg/devices"]}}'

      # DEVELOPER: swap the line above for this one to get the web interface back - it is how
      # stream types get tested by hand, and omitting allow_paths entirely is how go2rtc means
      # "unrestricted". One line swapped rather than a second -c, so that the two lines differ in
      # allow_paths and nothing else - dropping `listen` or `local_auth` while swapping would
      # quietly reopen the sidecar rather than widen it, which is not what this is meant to buy.
      # - '{"api":{"listen":"${GO2RTC_USERNAME:+:1984}","username":"${GO2RTC_USERNAME:-}","local_auth":true}}'

      # THE PASSWORD, and the only reason there is a third -c: it is the one value here worth
      # keeping off a command line, where every account on the host can read it out of
      # /proc/<pid>/cmdline. Separate api: keys given on separate -c sources are merged rather than
      # replaced (measured), so this fills in the password and changes nothing else above.
      #
      # The file itself holds no secret - it holds go2rtc's own placeholder, which go2rtc resolves
      # against $CREDENTIALS_DIRECTORY below. `$$` is how compose is told to leave a `$` alone, so
      # what reaches the container is the literal ${GO2RTC_PASSWORD:}; the configs: block at the
      # bottom of this file is where the text lives.
      #
      # THE EMPTY DEFAULT AFTER THE COLON IS LOAD-BEARING. An unresolvable ${VAR} is left standing
      # as literal text, and go2rtc would then accept the string "${GO2RTC_PASSWORD}" as the
      # password - a credential published in this file, for anyone who reads the repository. With
      # the colon it resolves to empty instead, which is the lockout an empty password has always
      # meant here. Measured on 1.9.14, both ways.
      - -c
      - /run/go2rtc/api-credential.yaml

    # Where go2rtc looks up a ${NAME} it cannot find in its environment: one file per name, named
    # for the variable. It is systemd's credentials convention, which go2rtc implements, and it is
    # what lets the password reach this container without ever being an environment variable of its
    # own - so it is in neither `docker inspect` nor /proc/<pid>/environ, and no camera process
    # go2rtc spawns inherits it.
    environment:
      CREDENTIALS_DIRECTORY: /run/secrets

    # The password, as a file this user can read and nobody else can. Same .env value the
    # application gets, written by compose into both containers, so the two still cannot drift.
    # Set-but-empty mounts no file, which leaves the placeholder resolving to empty - see the
    # command above for why that is the safe direction.
    secrets:
      - source: go2rtc-password
        target: GO2RTC_PASSWORD
        uid: "65532"
        mode: 0400

    # The placeholder file the third -c reads. Generated by compose rather than kept in the
    # repository, so there is no new file for a deployment to create, own, or keep in step.
    configs:
      - source: go2rtc-api-credential
        target: /run/go2rtc/api-credential.yaml
        uid: "65532"
        mode: 0444

    # Named, because Cameras__StreamServerBaseUrl points at it by name rather than by address.
    hostname: go2rtc

    # WebRTC media, and the only port this container publishes. Both protocols, because ICE prefers
    # UDP and falls back to TCP through a network that will not pass it - publishing one of the two
    # gives a browser that needs the other the same silent black screen the candidate does. The
    # host side is what a browser connects to, so it is the number in the candidate Homespool
    # writes; the container side stays 8555 because that is where go2rtc listens.
    #
    # IPv4 only, like the proxy's ports and for the same reason: this network carries no IPv6, and
    # the candidate Homespool writes is a v4 address, so a v6 listener here would only ever be
    # reached by mistake.
    ports:
      - "0.0.0.0:${WEBRTC_PORT:-8555}:8555/tcp"
      - "0.0.0.0:${WEBRTC_PORT:-8555}:8555/udp"

    # Cameras plugged into this machine, granted as a class: major 81 is video4linux, covering USB
    # webcams and the Pi's codec nodes both. Not `devices:` naming each camera, because an entry
    # naming a device that does not exist stops the container from starting - it could never ship
    # enabled.
    #
    # What it costs, stated plainly: this container can open any video device on the machine, and
    # sees the names of everything in /dev. If you would rather narrow it, delete both lines below
    # and name each camera:
    #
    #   devices:
    #     - /dev/v4l/by-id/usb-046d_0821_437242E0-video-index0
    #
    # using a by-id path, never /dev/video0: node numbers are handed out in enumeration order, and
    # one camera has been seen taking video0 from another inside a single session.
    device_cgroup_rules:
      - "c 81:* rmw"

    # What this container may do beyond running its own binary: nothing. It runs third-party code,
    # it fetches addresses people give it, and it decodes what those addresses return - so the
    # question is not whether it is trustworthy but how little it needs, and the answer measured on
    # a Pi 3 with a USB camera and an RTSP camera is: none of this.
    #
    # All settings below were tried one at a time and then together, each time asking both cameras
    # for a frame. Both answered under every one of them.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

    # Not root. Nothing this sidecar does needs it: it binds only unprivileged ports, and the one
    # thing it must write is /config.
    #
    # The group is the host's numeric video GID, and it has to be the NUMBER. `group_add: video`
    # resolves the name inside the container, where Alpine's video GID is not Debian's, so the name
    # form silently grants the wrong group and every attached camera goes black with nothing logged.
    # 44 is Debian and Raspberry Pi OS; check yours with `stat -c '%g' /dev/video0` and set
    # GO2RTC_VIDEO_GID if it differs. A network camera does not care either way.
    #
    # What this user must be able to write is its own configuration, and the volumes block below is
    # where that is arranged - read it before changing either.
    user: "65532:${GO2RTC_VIDEO_GID:-44}"

    # NOT read_only, and that is a trade taken deliberately: compose cannot write a secret or a
    # generated config into a read-only service at all - it refuses with "`file` is the sole
    # supported option" - so keeping the flag would mean keeping the sidecar's password on its
    # command line, where every account on the host can read it.
    #
    # What the flag was buying here is smaller than it looks, and was measured rather than assumed:
    # under this user, with every capability dropped, the only path it takes away is /var/tmp.
    # /tmp is a tmpfs either way (below), and /dev/shm stays writable under read_only regardless;
    # nothing else in the image is writable by uid 65532, because the image's own files are root's.
    #
    # /tmp stays a tmpfs so that scratch writes land in memory rather than on the card, which on a
    # Raspberry Pi is the difference this line was really making.
    #
    # What must stay writable either way is /config: registering a camera is a config write, and a
    # /config this user cannot write answers 400 to the registration and 500 to /api/config, in both
    # cases with nothing in the sidecar's log. The volumes block below is where that is arranged.
    tmpfs:
      - /tmp

    volumes:
      # One file, bind-mounted, and the only bind mount in this stack - everything else persistent
      # here is a named volume. The reason is ownership. A named volume is seeded from the image,
      # whose /config is owned by root, so a sidecar running as anything else cannot write its own
      # configuration; a host file has host ownership, which is something a deployment sets once and
      # never thinks about again. That is what buys the `user:` line above.
      #
      # IT MUST EXIST BEFORE THE FIRST START. Docker creates a *directory* at a bind-mount path that
      # is missing, and go2rtc then fails on a directory where it wanted its configuration. From
      # nothing:
      #
      #   printf 'streams: {}\n' > ./go2rtc.yaml && chown 65532:44 ./go2rtc.yaml && chmod 660 ./go2rtc.yaml
      #
      # The requirement is only that the file be WRITABLE by the identity in `user:` above, by owner
      # or by group - the line above is one way to satisfy it, not the shape it has to have. A file
      # left owned by the deployment's own user with group 44 is equally fine, and is what copying
      # one out of an older deployment tends to produce; measured, and the in-place rewrite keeps
      # whatever ownership it found. If cameras save but never appear, check this first.
      #
      # What is not negotiable is the last digit. A camera's source is stored here as go2rtc was
      # given it, so an RTSP URL carrying a password is a plaintext password in this file - and
      # nothing but go2rtc ever reads it, so there is no one for the world bit to serve.
      #
      # IT MUST NOT BE EMPTY, and that is newer than the rest of this comment: the sidecar is now
      # started with more than one configuration file (the password is in the third -c), and with
      # more than one, an empty first file leaves go2rtc merging into a nil map. The write
      # Homespool makes at startup then panics that request inside the sidecar - the WebRTC
      # candidate is lost, live view stays off, and the sidecar goes on running as though nothing
      # happened, with the panic the only trace. `streams: {}` is enough; setup-env.sh writes it,
      # and seeds a file it finds empty. Measured on 1.9.14, one file against two.
      #
      # Do not edit it by hand: it is rewritten by the sidecar whenever Homespool registers a
      # camera, and a camera described in two places is described wrongly in one of them.
      #
      # Measured rather than assumed, because the failure would be silent: go2rtc rewrites this file
      # IN PLACE, same inode, so mounting the single file holds. Were it to write a temporary file
      # and rename, a single-file mount would break and this would have to become a directory.
      - ./go2rtc.yaml:/config/go2rtc.yaml
      # Visibility only - the cgroup rule above is what grants access, and READ-ONLY is not a typo
      # or a thing to repair. Opening a capture device is governed by the node's own permissions and
      # the cgroup rule, never by this mount's flag, so v4l2 capture is unaffected: measured, with
      # the mount confirmed ro and a write inside the container refused, while frames kept arriving.
      - /dev:/dev:ro

    # Its own network, shared with the application and nothing else. The proxy and the certificate
    # renewer are not on it, so a sidecar that runs third-party code and fetches addresses people
    # give it can reach neither. Not `internal`: it has to reach network cameras on the LAN, which
    # goes out through this bridge's NAT like any other container's traffic.
    networks:
      - homespool-cameras

    restart: unless-stopped

  # The front door for everything, and the reason "TLS by default" is true of a fresh
  # `docker compose up` rather than of a deployment somebody finished configuring. It terminates
  # TLS for pages and /api on one port and for printers on another - their own server block and
  # their own certificate, the ECDSA leaf the app mints - and passes plain HTTP to the app over
  # this network.
  #
  # Replacing this with a Traefik, Caddy or nginx of your own is supported for the people-facing
  # half - the app only needs XForwarded__KnownProxies to name yours - but the printer half is
  # fussier than a normal reverse proxy: exactly one certificate presented, no chain, one
  # ciphersuite, no response buffering, and OpenSSL rather than Go's crypto/tls. Read
  # nginx/homespool-printer.conf before substituting anything for that half.
  proxy:
    logging: *logging
    image: ${REGISTRY:+${REGISTRY}/}homespool-proxy
    build:
      context: ./nginx

    # IPv4 ONLY, on every port here, and the 0.0.0.0 is what says so. Published without an address,
    # Docker also listens on [::] - but this network has no IPv6, so a v6 connection is relayed by
    # docker-proxy and reaches nginx from the bridge gateway, 172.28.0.1. Measured on the appliance
    # 2026-09-05: the same /health request logged as the client's own address over v4 and as
    # 172.28.0.1 over v6. That address is inside the private ranges /health answers to, so a v6
    # client anywhere on the internet would pass the filter meant to keep it out - and every v6
    # client shares one X-Real-IP, so attempt limiting and the logs cannot tell them apart.
    #
    # Serving IPv6 properly is a piece of work, not a flag: enable_ipv6 on the network below with a
    # subnet, that subnet in Certificates__ContainerNetworks and a v6 proxy address in
    # XForwarded__KnownProxies, Kestrel
    # listening on v6, and the health allow-list revisited. Until that is done, not offering v6 is
    # the only configuration in which the addresses this stack reasons about are real. A browser
    # that tries v6 first gets a refusal and falls back to v4 on its own.
    ports:
      - "0.0.0.0:${PORT:-80}:8080"
      - "0.0.0.0:${HTTPS_PORT:-443}:8443"

      # What a printer connects to; it must match PrusaConnect__PrinterPort above - that is the
      # number written into every provisioning bundle. 15443 rather than 443 on both sides:
      # containers here run as non-root and cannot bind 443, and 443 on the host belongs to the
      # browser.
      - "0.0.0.0:${PRINTER_PORT:-15443}:15443"

      # What a printer fetches an encrypted download from; it must match PrusaConnect__TransferPort
      # above. Plain HTTP, deliberately and permanently: the printer cannot open a TLS socket for
      # this, and the body is ciphertext. See nginx/homespool-transfer.conf before publishing it
      # any further than the LAN.
      - "0.0.0.0:${TRANSFER_PORT:-15080}:15080"

      # The legacy plaintext printer listener. PUBLISHED UNCONDITIONALLY AND CLOSED UNLESS ASKED FOR:
      # with LEGACY_PRINTER_PORT unset the application opens no such listener and the proxy installs
      # no server block, so this port refuses connections. That is deliberate - making the
      # publication itself conditional would mean two things that must agree, and a variable set
      # with the publication forgotten leaves printers reaching a port nothing serves, with nothing
      # at either end to say why. IPv4 only, like the four above and for the
      # same reason - and it matters more here, where the token crosses in clear and the rate limits
      # key on the address nginx reports.
      - "0.0.0.0:${LEGACY_PRINTER_PORT:-15800}:15800"

    environment:
      # The same zone the application uses, so the two logs can be read side by side without
      # arithmetic. Only nginx's own timestamps read it - envsubst is filtered below.
      TZ: "${TZ:-UTC}"

      # Read by 21-legacy-printer-listener.sh, which installs the plaintext printer block only when
      # this is set - the same variable that opens the application's own listener above, so one
      # answer serves both halves. Empty is the normal case and installs nothing.
      LEGACY_PRINTER_PORT: "${LEGACY_PRINTER_PORT:-}"

      # The names this proxy answers to - server_name in both user-facing blocks, and the subject and
      # subject-alternative names of the self-signed certificate generated on first start. A
      # semicolon-separated list; 16-user-server-names.envsh derives the space-separated form nginx
      # wants, and 25-self-signed-certificate.sh splits it for the certificate.
      #
      # Renamed from USER_HOST, which is NOT read as a fallback: a .env still carrying the old name
      # falls to localhost here, and every other name this machine answers to is then refused. The
      # failure is total and immediate rather than subtle, which is why it is a rename rather than
      # an alias - see .env.example.
      USER_HOSTS: "${USER_HOSTS:-localhost}"

      # The port a browser should ask for, named in two places that must agree: the redirect from
      # the HTTP listener, and the Host the proxy passes to the application, which is what every
      # emailed link is built from. Neither can read it off the request - $host carries no port, and
      # the client's own is not a fact about this deployment. Derived from HTTPS_PORT by
      # 15-redirect-port-suffix.envsh at container start: empty for 443 so the common case keeps a
      # clean URL, ":8443"-shaped otherwise.
      # "auto" is the derivation sentinel - it means neither name below is in .env. Setting
      # REDIRECT_PORT_SUFFIX there overrides the derivation, explicit empty included, for the
      # deployment where a router forwards 443 inward and the browser's port is not the published
      # one. HTTPS_PORT_SUFFIX is the setting's pre-rename name, honoured so an existing .env
      # keeps its meaning; the new name wins when both are set.
      HTTPS_PORT: "${HTTPS_PORT:-443}"
      REDIRECT_PORT_SUFFIX: "${REDIRECT_PORT_SUFFIX-${HTTPS_PORT_SUFFIX-auto}}"

      # Restricts envsubst to those variables. WITHOUT THIS the templates' own $host, $request_uri,
      # $server_port and $homespool_upstream are all substituted with nothing, nginx starts on a
      # configuration that parses and redirects everyone to "https://", and the cause looks nothing
      # like the symptom. The filter is the whole safety of this arrangement.
      NGINX_ENVSUBST_FILTER: "REDIRECT_PORT_SUFFIX|USER_SERVER_NAMES"

      # Read by 26-user-tls-servers.sh, which sends Strict-Transport-Security only on names served
      # with a publicly-issued certificate - a self-signed name never gets it, whatever this says.
      # Empty is the default and sends nothing.
      HSTS: "${HSTS:-}"

    volumes:
      # From the repository rather than baked into the image: this is the file an operator is most
      # likely to want to change (HSTS, a hostname, an extra header), and a mount makes that an
      # edit and a restart instead of a rebuild. A template rather than straight into conf.d - the
      # entrypoint renders it there, substituting the HTTPS port into the redirect.
      - ./nginx/homespool.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/homespool-proxy.conf:/etc/nginx/homespool-proxy.conf:ro

      # Which Host each listener passes on, which is what the application builds its absolute URLs
      # from. A template like the one above, and for the same reason: it names the port a browser
      # should ask for, and that is REDIRECT_PORT_SUFFIX - already in the envsubst filter below.
      - ./nginx/homespool-public-host.conf.template:/etc/nginx/templates/00-public-host.conf.template:ro

      # The access log format every server block names, which leaves query strings out - emailed
      # links carry their codes there. Straight into conf.d, and named to sort first: a format has
      # to be defined before the first access_log that uses it is parsed.
      - ./nginx/homespool-access-log.conf:/etc/nginx/conf.d/00-access-log.conf:ro

      # The body of the user-facing TLS listener, included once per name by the blocks
      # 26-user-tls-servers.sh generates into conf.d at start. NOT into conf.d itself: it is a
      # fragment of a server block, and nginx would refuse to start on a `location` at top level.
      #
      # Mounted rather than baked for the same reason as the template above - this is where the
      # upload limit, the proxy timeouts and the HSTS header live, so it is the other file an
      # operator is likely to want to edit.
      - ./nginx/homespool-user-tls.conf:/etc/nginx/homespool-user-tls.conf:ro

      # NOT into conf.d, deliberately: the entrypoint hook copies it there only when this
      # deployment has a printer leaf to serve. Dropped straight into conf.d it would be
      # unconditional, and nginx would refuse to start at all on a stack with printer TLS turned
      # off, taking the pages down with it over a certificate the operator deliberately does not
      # have.
      - ./nginx/homespool-printer.conf:/etc/nginx/homespool-printer.conf:ro
      - ./nginx/homespool-health-access.conf:/etc/nginx/homespool-health-access.conf:ro

      # Straight into conf.d, unlike the printer block: there is no certificate to wait for. Plain
      # HTTP, /f/* only.
      - ./nginx/homespool-transfer.conf:/etc/nginx/conf.d/homespool-transfer.conf:ro

      # NOT into conf.d, for a different reason than the printer block: there is no certificate to
      # wait for here either, but this listener must not exist unless LEGACY_PRINTER_PORT asked for it.
      # The hook copies it across on that one condition, which is the same variable that opens the
      # application's listener - so the block and the socket behind it cannot disagree.
      - ./nginx/homespool-legacy-printer.conf:/etc/nginx/homespool-legacy-printer.conf:ro

      # The user-facing certificate. Named rather than a bind mount so the directory keeps the
      # ownership the image gave it - an unprivileged nginx has to be able to write the self-signed
      # one it generates, and a host directory would arrive owned by whoever created it.
      - homespool-proxy-certs:/etc/nginx/certs

      # The printer-facing leaf, written by the app. Read-only because reissue is the app's,
      # through Admin -> Printer certificate - a proxy that could rewrite the leaf could serve
      # printers a certificate the app knows nothing about.
      - homespool-printer-leaf:/etc/nginx/printer-certs:ro

    # The app writes the leaf's private key readable by its own group and nobody else, so nginx
    # (uid 101, no root in this image) reads it through this supplementary group. 1654 is the app
    # user the .NET base image creates and Homespool's Dockerfile runs as; if you build with a
    # different APP_UID, put that user's group here or the printer listener cannot start.
    group_add:
      - "1654"

    # nginx is uid 101 here with no root in the image at all, and every listener is above 1024 -
    # that is what the unprivileged base image buys, and it is why Compose publishes the low ports
    # onto 8080, 8443, 15443, 15080 and 15800 instead of nginx binding them. So there is no
    # capability in use to take away; what these two add is that nothing in here can acquire one.
    # Dropping the bounding set means no binary runs with a capability whatever its file says, and
    # no-new-privileges means a setuid binary runs as the caller. Measured against the same image
    # without them: the entrypoint hooks mint the self-signed certificates and write the user
    # server blocks, the TLS listener serves them, an unknown name still gets 444, and
    # `nginx -s reload` works - which is the path 20-printer-listener.sh takes when the printer
    # leaf appears and is the one that would stop the printer listener ever starting.
    #
    # group_add above is untouched by this: a supplementary group is not a capability, so the leaf's
    # private key is still readable.
    #
    # NOT read_only, and not narrowly: the base image's entrypoint renders the templates into
    # /etc/nginx/conf.d, so a read-only filesystem leaves default.conf unrendered - and the
    # container starts anyway, serving a configuration nobody wrote.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

    # Whatever address Docker hands out: the application trusts forwarded headers from this whole
    # network (XForwarded__KnownNetworks above), which is sound because the network holds this
    # container and the application and nothing else. Not a pinned ipv4_address - Docker does not
    # reserve one ahead of the container that declares it, so the application, started first and
    # allocated first, was handed the pinned address and this container could not start at all.
    networks:
      - homespool

    # service_started, not service_healthy: waiting for health kept every port closed for the whole
    # of startup, and a first boot on a Raspberry Pi migrates a database before it reports healthy -
    # minutes of refused connections, reported as a broken deployment. The race this used to guard
    # lives in 20-printer-listener.sh now, which watches for the printer leaf and reloads nginx
    # when it appears, so the printer listener still never serves without a certificate. What is
    # given up: "nginx is running" no longer implies the application was healthy at least once, and
    # anything that reasons that way needs to stop.
    depends_on:
      homespool:
        condition: service_started

    restart: unless-stopped

  # Obtains a publicly-trusted certificate for one name, over the ACME DNS-01 challenge. ENTIRELY
  # OPTIONAL and off unless asked for: the `certs` profile means an ordinary `docker compose up`
  # never starts it, never reads the credentials file below, and never needs one to exist. A
  # deployment that wants TLS and has no domain keeps the self-signed certificates the proxy mints
  # for itself and is complete without this.
  #
  # DNS-01 rather than HTTP-01, and that is what makes it usable at home: the challenge is answered
  # by writing a DNS record, so nothing here has to be reachable from the internet on port 80. A
  # machine behind a household router, with no forward and no public address, can hold a certificate
  # for a name that resolves anywhere.
  #
  # ONE NAME PER RUN. lego names the files it writes after the FIRST domain given, so a run naming
  # several would produce one certificate and one file - and every other name would find nothing
  # under its own name and fall back to the self-signed one, silently. acme/homespool-renew-cert.sh
  # runs this service once per name in ACME_HOSTS, overriding LEGO_DOMAINS each time.
  #
  # Pinned to the major, not a digest. This container holds the DNS API token and writes every
  # user-facing TLS key, and `docker compose run` pulls whatever the tag points at on the next
  # timer - so an untagged image meant an unreviewed build about twice a month (lego released
  # fourteen times between May and August 2026). A digest would be stricter but goes stale at
  # that cadence; the major keeps patch releases flowing and makes a breaking change a deliberate
  # edit here.
  certs:
    logging: *logging
    image: goacme/lego:v5
    profiles: ["certs"]

    # A network of its own. It needs outbound internet for the certificate authority and the DNS
    # API, and nothing in this stack - it writes the proxy's certificates through the shared volume
    # below, not over the network. Holding the DNS token, it is the container that least belongs
    # beside the application's listeners.
    #
    # A named network rather than none: a service with no networks: line makes compose create
    # <project>_default, a bridge whose gateway address this machine's name resolves to and whose
    # range nothing here can name. This one has a range, and Certificates__ContainerNetworks knows
    # it.
    networks:
      - homespool-certs

    # The same uid the proxy runs as, which is what lets the proxy read what this writes. It is
    # possible because the credentials arrive as environment rather than as a compose secret: a
    # secret is bind-mounted carrying the host file's ownership, so a container that is not root
    # cannot read one, and lego would have had to run as root and hand the files over afterwards.
    user: "101:101"

    # Nothing in here needs a capability: it makes an outbound TLS call and writes files into the
    # volume below as the uid above, so dropping the bounding set takes away a set this process
    # never had an effective bit in, and no-new-privileges closes the setuid route. They reach the
    # `docker compose run` one-off containers this service is only ever started as, which is the
    # part worth checking rather than assuming.
    #
    # THEY DO NOT COST IT THE DNS CREDENTIAL, which is the thing to satisfy yourself about before
    # touching this. The env_file below is opened by the compose CLI ON THE HOST, before this
    # container exists, and its values arrive as environment - the file is never in here, so no
    # capability of this container's was ever between it and the token. Measured on a deployment
    # with the real root-owned credentials file, both ways: the same variables arrive with the pair
    # as without, the provider's token among them.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"

    # The provider's credentials, under whatever names that provider uses - CLOUDFLARE_DNS_API_TOKEN,
    # AWS_ACCESS_KEY_ID, and so on for the hundred-odd providers lego supports. `lego dnshelp -c
    # <provider>` names them; acme/README.md has the common ones.
    #
    # required: false is what keeps this optional. The file is absent on every deployment that never
    # asked for ACME, and compose must not fail for want of it - which it would, at container
    # creation, if this were a secret naming a path that does not exist.
    #
    # Any other lego setting can go in here too, since every flag has an environment variable.
    # LEGO_DNS_RESOLVERS is the one worth knowing about: lego defaults to the system nameservers and
    # falls back to Cloudflare's, which is right almost everywhere, and a split-horizon resolver that
    # answers differently from the public internet is the case that needs overriding.
    #
    # READ BY THE COMPOSE CLI, NOT BY THE DAEMON OR THE CONTAINER, and that is the one surprising
    # thing about it: the file is opened by whoever types the command, so a 0600 root-owned
    # credentials file means every `--profile certs` command needs root. The systemd units run as
    # root, so renewal is unaffected; a `docker compose --profile certs run ...` typed by hand needs
    # `sudo`, and without it fails with a bare "permission denied" naming the file and nothing else.
    #
    # This is confined to the certs profile. Compose reads an env_file only for services in an
    # ACTIVE profile, so an ordinary `docker compose up` neither reads this file nor cares that it
    # cannot - which is what keeps an unreadable credentials file from breaking the whole stack for
    # a non-root user.
    env_file:
      - path: /etc/lego/dns.env
        required: false

    environment:
      # Every lego flag has an environment variable, which is why there is no argument list here to
      # build conditionally. A setting left empty is simply not set, and lego uses its own default.
      LEGO_PATH: /certs
      LEGO_ACCEPT_TOS: "true"

      # Which DNS provider answers the challenge. `lego dnshelp` lists them.
      LEGO_DNS: "${ACME_DNS_PROVIDER:-cloudflare}"

      # The registration and recovery address the CA holds. Let's Encrypt sends expiry warnings here
      # if a renewal ever stops running, which is the last line of defence behind the timer.
      LEGO_EMAIL: "${ACME_EMAIL:-}"

      # The names this deployment wants certificates for, spelled as .env spells them - semicolons,
      # like USER_HOSTS.
      #
      # DELIBERATELY NOT LEGO_DOMAINS, and the difference matters: lego splits a domain list on
      # COMMAS, so handing it a semicolon-joined string asks for a single certificate for one
      # nonsensical name - and it would try, and fail against the authority, saying nothing about
      # separators. acme/homespool-renew-cert.sh reads this, splits it, and sets LEGO_DOMAINS to one
      # name for each run.
      #
      # Leaving LEGO_DOMAINS unset here is also what makes a bare `docker compose run --rm certs`
      # fail immediately and legibly, instead of quietly doing the wrong thing.
      ACME_HOSTS: "${ACME_HOSTS:-}"

    volumes:
      # The same volume the proxy reads its certificates from. lego's own layout puts them in
      # certificates/ inside it, which is exactly where 26-user-tls-servers.sh looks first - so a
      # certificate obtained here is served with nothing to link, copy or rename.
      - homespool-proxy-certs:/certs

    command: run

# The two credentials in .env that reach a container as a file instead of as an environment
# variable, and the one generated file that reads one of them.
#
# `environment:` is the source, not `file:`, and the difference decides everything about how these
# behave. Compose reads the named variable from its own environment - .env included, which is why
# nothing about deploying changes - and writes the value into the container itself. With a `file:`
# source it would bind-mount a host file instead, keeping that file's owner and mode and ignoring
# the uid and mode each service asks for, so a container that is not root could not read its own
# secret; every service here runs as somebody.
#
# Consequences worth knowing before editing these, all measured on compose v5.3.1:
#
#   - A variable that is not set at all fails `docker compose up` for the services that use it,
#     naming both the variable and the secret. `down`, `ps` and `config` are unaffected.
#   - Set-but-empty is not an error and mounts NO FILE. Each reader treats the absence as empty,
#     which is what an empty value meant before this, so "no credential" still says itself.
#   - `docker compose config` still prints .env's values, as it always has. This changes what a
#     container carries, not what the file renders to.
#   - CHANGING A VALUE IN .env DOES NOT REACH A RUNNING CONTAINER. A secret's content is not part of
#     what compose compares when it decides whether to recreate a service, so `docker compose up -d`
#     reports "Running" and the old credential stays live - where an environment variable would have
#     forced a recreation by changing the container's configuration. ROTATING ONE TAKES
#     `docker compose up -d --force-recreate`, and it takes it for both readers at once: recreate
#     only the application and it authenticates to a sidecar still holding the old password.
secrets:
  go2rtc-password:
    environment: GO2RTC_PASSWORD
  ca-passphrase:
    environment: CA_PASSPHRASE

configs:
  # Read by the sidecar's third -c. It carries go2rtc's own placeholder and no value: `$$` keeps
  # compose from substituting, so the container receives the literal ${GO2RTC_PASSWORD:}, and
  # go2rtc fills it from the file in $CREDENTIALS_DIRECTORY.
  #
  # NEVER let this content go empty. Compose treats an empty `content:` as no content at all, falls
  # back to a `file:` source with an empty path, and mounts THE WHOLE PROJECT DIRECTORY - .env
  # included - into the container at the target path. Measured; there is no warning.
  go2rtc-api-credential:
    content: |
      api:
        password: "$${GO2RTC_PASSWORD:}"

networks:
  # THE PROXY AND THE APPLICATION, AND NOTHING ELSE JOINS THIS NETWORK. Every container on it is a
  # trusted forwarder - the application believes X-Real-IP and X-Forwarded-Proto from any address
  # in this range - so a third service added here could tell the application who the client is.
  # A sidecar goes on a network of its own, as the two below do.
  #
  # The range is pinned rather than left to Docker's allocator, so that Certificates__ContainerNetworks
  # and XForwarded__KnownNetworks can name it - it stops being something the operator has to
  # discover and becomes something we chose. Change the subnet if it collides with something on
  # your host, and change PROXY_NETWORK in .env with it; setup-env.sh does both together.
  homespool:
    ipam:
      config:
        - subnet: "${PROXY_SUBNET:-172.28.0.0/16}"

  # The camera sidecar's network, shared with the application alone; the certificate renewer's,
  # shared with nothing. Each has a pinned range for the reason the first one does - it has to be
  # nameable in Certificates__ContainerNetworks, or its gateway lands in the printer certificate.
  # setup-env.sh checks all three ranges against the host and moves any that collides.
  homespool-cameras:
    ipam:
      config:
        - subnet: "${CAMERA_SUBNET:-172.29.0.0/16}"
  homespool-certs:
    ipam:
      config:
        - subnet: "${CERTS_SUBNET:-172.30.0.0/16}"

volumes:
  # Keeps the SQLite database across container replacement. Use a local docker volume or a
  # bind-mount to local disk - do NOT put this on NFS/CIFS/a NAS share, where SQLite WAL
  # locking is unreliable and will corrupt the database.
  homespool-data:

  # The user-facing certificate, self-signed on first start unless you put your own here. Kept
  # across container replacement so the exception someone clicked through keeps meaning something -
  # a certificate regenerated on every start teaches people that the warning is noise.
  homespool-proxy-certs:

  # The printer-facing leaf and its key, in PEM: written by the app, read by the proxy.
  # Deliberately NOT part of homespool-data, which holds the certificate authority's private key -
  # the one secret here that cannot be rotated without a USB visit to every printer, and whoever
  # holds it can mint a certificate every provisioned printer will believe, permanently, with no
  # revocation to stop it. This volume holds only what is safe to hand the network-facing
  # container.
  homespool-printer-leaf:
