# A Raspberry Pi 3 SD-card image with the Homespool stack baked in.
#
# Pi 3 rather than 4/5 because that is the board this was first tested on. The device layer is the
# only thing that ties it there: rpi-image-gen ships pi4, pi5, cm4, cm5 and zero2w beside pi3, so
# retargeting is a one-word change here. Everything below is board-agnostic.
#
# Trixie, matching the deployment the compose stack is developed against.
device:
  layer: rpi3

  # device-base would otherwise generate "pi3-<six random letters>", which is sensible for a fleet
  # and wrong for one appliance you want to find again. This is the name avahi advertises, so it is
  # also what makes http://homespool.local work - the only address anyone is given, since the Pi's
  # IP is a DHCP lease nobody wants to memorise.
  hostname: homespool

layer:
  custom: homespool

# The physical console's keyboard, and only that - an SSH session uses the client's layout, so this
# matters exactly when something has gone wrong badly enough that you have attached a monitor.
#
# rpi-image-gen's own default is gb / English (UK), inherited from its layer/base/locale-config.yaml.
# US instead, because a distributed appliance cannot know where it lands and US is the layout people
# can type around from memory when it is wrong: the letters are where almost every other layout puts
# them, and only the symbols move. GB is the same bet with worse odds - it is a specific national
# layout that happens to be the tool's default, not a neutral one.
#
# Set through the tool's variables rather than a customize-hook writing /etc/default/keyboard. That
# file is generated by keyboard-configuration's postinst from these debconf answers, so a hook would
# be racing the package that owns it - the mistake this layer already made twice, with /etc/hostname
# and /etc/fstab. The spelling is confusing and worth stating: keyboard_keymap is the XKB *layout*
# (us), keyboard_layout is the *variant* (English (US)).
locale:
  keyboard_keymap: us
  keyboard_layout: English (US)

# Lets the device user drive the stack - docker compose logs, ps, restart - without sudo in front of
# every command. It is effectively root on this box (the docker group always is), which is a real
# security statement and the right one here: this is a single-purpose appliance whose entire job is
# running those containers, and the alternative is an operator who types sudo reflexively.
docker:
  trust_user1: y

image:
  layer: image-rpios
  name: homespool-rpi-arm64
  compression: zstd

  # 200% of the boot content, which is small and fixed.
  boot_part_size: 200%

  # Modest on purpose. This is no longer the size the board lives with - the layer installs
  # raspberrypi-sys-mods, so the partition grows to fill the card in the initramfs on first boot and
  # the filesystem follows. All this decides is the size of the *image file*, and every megabyte of
  # it is written across a card reader at ~20 MB/s by whoever flashes it.
  #
  # It was 250% while the size was final, which shipped ~2 GB of zeros to be overwritten by the
  # resize on the first boot.
  #
  # Not lower than this, though, and the reason is the failure case rather than the normal one: at
  # 120% a board whose resize did not happen - flashed to a card the same size, or a future change
  # that quietly stops resize_early running - would come up with a couple of hundred megabytes free,
  # which is not enough to migrate a database into. 150% leaves it degraded but usable, and still
  # nearly halves the image.
  root_part_size: 150%
